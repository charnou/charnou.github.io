<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Interface English</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  color-scheme:light only;
  --bg:#F6F7F9; --card:#FFFFFF; --line:#E2E5EB; --line-soft:#EEF0F4;
  --ink:#15171C; --ink-soft:#474D5B; --ink-muted:#767D8D;
  --acc:#4F46E5; --acc-ink:#3730A3; --acc-tint:#EDEEFE;
  --ok:#0F7D68; --ok-ink:#0A5A4A; --ok-tint:#E4F5F1;
  --near:#A96108; --near-ink:#834A06; --near-tint:#FCF2E2;
  --bad:#BB3626; --bad-ink:#8B281B; --bad-tint:#FAEBE8;
  --r:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(16,18,29,.05),0 6px 18px rgba(16,18,29,.05);
  --ease:cubic-bezier(.33,1,.68,1);
  --f-head:"Segoe UI Semibold","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
svg{display:block}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}

.top{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);z-index:6}
.top-in{display:flex;align-items:center;gap:14px;height:54px}
.brand{font:600 16px/1 var(--f-head);letter-spacing:-.2px;white-space:nowrap}
.brand b{color:var(--acc)}
.meter{flex:1 1 auto;height:5px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:50px}
.meter i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .4s var(--ease)}
.score{font:600 13px/1 var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-muted)}
.reset:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.tabsbar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.tabs{display:flex;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.tab{position:relative;flex:0 0 auto;background:none;border:none;padding:11px 13px 9px;font-size:13.5px;color:var(--ink-muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab .tn{font:600 10.5px/1 var(--f-mono);opacity:.65}
.tab.on{color:var(--acc-ink);border-bottom-color:var(--acc);font-weight:600}
.tab .tick{color:var(--ok)}
@media (hover:hover){.tab:hover{color:var(--ink)}}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:contain}
main>.wrap{padding-bottom:28px}

.pager{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);z-index:5}
.pager-in{display:flex;align-items:center;gap:12px;height:56px}
.pager .mid{flex:1 1 auto;text-align:center;font-size:13px;color:var(--ink-muted)}
.pager .mid b{color:var(--ink);font-family:var(--f-mono)}

.chap-h{padding:22px 0 4px}
.chap-h h1{margin:0;font:600 24px/1.25 var(--f-head);letter-spacing:-.4px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.chap-h h1[tabindex]:focus{outline:none}
.chap-h h1[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:4px}
.chap-h .mins{font:500 12px/1 var(--f-mono);color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.chap-h .lead{margin:9px 0 0;color:var(--ink-soft);font-size:15px;max-width:820px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin:16px 0}
.card>*:not(.mockwrap):not(.mockbox){max-width:830px}
.card>h2{margin:0 0 10px;font:600 17px/1.35 var(--f-head)}
.q{margin:0 0 4px;font-weight:600;font-size:16.5px;line-height:1.45}
.sub{margin:3px 0 12px;font-size:14px;color:var(--ink-muted)}

.ru{font-size:14.5px;color:var(--ink-soft)}
.ru-hide{font:500 13px/1.4 var(--f-ui);color:var(--acc);border-bottom:1px dashed var(--acc);cursor:pointer;white-space:nowrap}
.ru-open{color:var(--acc);font-size:14.5px}
.ru-hide:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.k{font-family:var(--f-mono);font-size:.9em;background:var(--acc-tint);color:var(--acc-ink);border-radius:5px;padding:1px 4px;white-space:nowrap}

.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;transition:border-color .15s,background .15s;min-height:44px}
.opt .mk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--f-mono);color:var(--ink-muted)}
.opt .tx{flex:1 1 auto}
.opt.is-ok{border-color:var(--ok);background:var(--ok-tint)}
.opt.is-ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-tint)}
.opt.is-bad .mk{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.is-near{border-color:var(--near);background:var(--near-tint)}
.opt.is-near .mk{border-color:var(--near);background:var(--near);color:#fff}
@media (hover:hover){.opt:hover{border-color:var(--acc)}}

.fb{margin:12px 0 0;padding:11px 13px;border-radius:var(--r-sm);font-size:14.5px;display:none}
.fb.on{display:block}
.fb.ok{background:var(--ok-tint);color:var(--ok-ink);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-tint);color:var(--bad-ink);border:1px solid var(--bad)}
.fb.near{background:var(--near-tint);color:var(--near-ink);border:1px solid var(--near)}
.fb.hint{background:var(--acc-tint);color:var(--acc-ink);border:1px solid var(--acc)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;min-height:40px}
.btn.ghost{background:none;color:var(--acc-ink);border-color:var(--line)}
.btn.tiny{padding:6px 12px;font-size:13px;font-weight:500;min-height:34px}
.btn[disabled]{opacity:.45;cursor:default}
.say{background:none;border:none;padding:2px 4px;opacity:.55;display:inline-flex;vertical-align:-3px}
.say svg{width:15px;height:15px}
@media (hover:hover){.say:hover{opacity:1}}

.vocab{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:14.5px}
.vocab td{border-bottom:1px solid var(--line-soft);padding:7px 10px 7px 0;vertical-align:top}
.vocab td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap;width:1%;padding-right:14px}
.vocab td:nth-child(2){color:var(--ink-soft);width:1%;white-space:nowrap;padding-right:14px}
.vocab tr.core td:first-child:after{content:"ядро";font:600 9px/1 var(--f-ui);background:var(--acc-tint);color:var(--acc-ink);border-radius:4px;padding:2px 4px;margin-left:6px;vertical-align:2px}

.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0 0}
.fam>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.fam h3{margin:0 0 6px;font:600 14px/1.3 var(--f-head)}
.fam ul{margin:0;padding-left:17px;font-family:var(--f-mono);font-size:13px;line-height:1.75}
.fam p{margin:7px 0 0}

.pairs{display:flex;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.col{flex:1 1 210px;display:flex;flex-direction:column;gap:7px;min-width:190px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:10px 12px;text-align:left;font-size:14.5px;min-height:44px}
.chip.en{font-family:var(--f-mono);font-weight:600}
.chip.sel{border-color:var(--acc);background:var(--acc-tint)}
.chip.is-ok{border-color:var(--ok);background:var(--ok-tint);cursor:default}
.chip.is-bad{border-color:var(--bad);background:var(--bad-tint)}
.chip[disabled]{cursor:default}
@media (hover:hover){.chip:not([disabled]):hover{border-color:var(--acc)}}

.gapline{font-size:16.5px;line-height:2.1;margin:12px 0 0}
.slot{display:inline-block;min-width:110px;border-bottom:2px solid var(--acc);text-align:center;font-family:var(--f-mono);font-weight:600;color:var(--acc-ink);padding:0 6px}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 11px;font:600 14px/1.2 var(--f-mono);min-height:38px}
.tok.is-ok{border-color:var(--ok);background:var(--ok-tint)}
.tok.is-bad{border-color:var(--bad);background:var(--bad-tint)}

.stackphr{font:600 19px/1.4 var(--f-mono);letter-spacing:-.2px;padding:12px 14px;background:var(--acc-tint);border-radius:var(--r-sm);color:var(--acc-ink);margin:12px 0 0}
.stackslots{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.stackslot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:44px;font-size:14.5px}
.stackslot .n{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--line-soft);color:var(--ink-muted);font:600 12px/22px var(--f-mono);text-align:center}
.stackslot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-tint)}
.stackslot .ph{color:var(--ink-muted);font-size:13.5px}
.stackslot.next{border-color:var(--acc);background:var(--acc-tint)}
.stackslot.next .ph{color:var(--acc-ink);font-weight:600}
.howto{background:var(--acc-tint);color:var(--acc-ink);border-radius:var(--r-sm);padding:10px 13px;margin:10px 0 0;font-size:14px}

.reserve{border:1px solid var(--line);border-left:4px solid var(--ink-muted);border-radius:var(--r);margin:26px 0 0;background:#FBFBFC;padding:0 15px 8px}
.reserve>.rh{margin:0 -15px 4px;padding:12px 15px;border-bottom:1px dashed var(--line);font-weight:400;font-size:inherit}
.reserve>.rh .lb{display:inline-block;font:600 10.5px/1 var(--f-mono);letter-spacing:.8px;background:var(--ink-muted);color:#fff;border-radius:4px;padding:4px 7px;vertical-align:2px}
.reserve>.rh .tt{font:600 15px/1.35 var(--f-head);margin-left:9px}
.reserve>.rh .ds{display:block;margin-top:5px;font-size:13.5px;color:var(--ink-muted)}

.talk{border:1px solid var(--near);background:var(--near-tint);border-radius:var(--r);margin:16px 0;padding:14px 17px}
.talk h3{margin:0 0 8px;font:600 15px/1.35 var(--f-head);color:var(--near-ink);display:flex;align-items:center;gap:8px}
.talk h3 svg{width:17px;height:17px;flex:0 0 auto}
.talk p,.talk li{font-size:14.5px;color:var(--near-ink)}
.talk ul{margin:6px 0 0;padding-left:20px}
.talk li{margin:5px 0}

.rule{display:flex;gap:13px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r-sm);padding:14px 16px;margin:10px 0}
.rule .rn{flex:0 0 auto;font:600 20px/1 var(--f-head);color:var(--acc);opacity:.45}
.rule h3{margin:0 0 5px;font:600 15.5px/1.35 var(--f-head)}
.rule p{margin:0 0 6px;font-size:14.5px;color:var(--ink-soft)}
.rule p:last-child{margin:0}
.rule .how{font-size:14px;color:var(--ink);background:var(--acc-tint);border-radius:8px;padding:8px 11px;margin-top:8px}

.sig{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:14.5px}
.sig td,.sig th{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.sig th{background:var(--line-soft);font-weight:600;font-size:13px}
.sig td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap;width:1%}

.mockbox{margin:12px 0 0}
.mockwrap{border-radius:var(--r-sm);overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line)}
.mockwrap.pad{background:#E7E9ED;padding:24px 18px;display:flex;justify-content:center}
[data-zone]{cursor:pointer;position:relative}
[data-zone]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (hover:hover){
  [data-zone]:hover{outline:2px solid var(--acc);outline-offset:1px;border-radius:3px}
  .mock-ribbon .ri.dim:hover,.mock-cookie .prow .sw.lock:hover{outline-color:var(--ink-muted)}
  .mock-game [data-zone]:hover{outline-color:#E8C87A}
  .mock-cookie [data-zone]:hover{outline-color:#93B4FF}
}
[data-zone]:active{outline:2px solid var(--acc-ink);outline-offset:1px}
.mock-game [data-zone]:active{outline-color:#fff}
.mock-cookie [data-zone]:active{outline-color:#fff}
.mocktools{display:flex;gap:8px;align-items:center;margin:8px 0 0;flex-wrap:wrap}
.mocktools .hintx{font-size:12.5px;color:var(--ink-muted)}
.trbtn{border:1px solid var(--acc);background:var(--acc-tint);color:var(--acc-ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.trbtn svg{width:14px;height:14px}
.trbtn.on{background:var(--acc);color:#fff}
[data-t].tr-on{color:var(--acc)!important}

.mock-ribbon{min-width:1000px;background:#F1F1F1;font:13px/1.3 "Segoe UI",Arial,sans-serif;color:#1A1A1A}
.mock-ribbon .title{background:#fff;padding:5px 10px;font-size:12px;color:#444;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #DDD}
.mock-ribbon .title .logo{font-weight:700;color:#0B7285}
.mock-ribbon .tabs2{display:flex;background:#fff;border-bottom:1px solid #CFCFCF}
.mock-ribbon .tabs2 span{padding:7px 15px;font-size:13px;border-bottom:2px solid transparent}
.mock-ribbon .tabs2 span.file{background:#217346;color:#fff}
.mock-ribbon .tabs2 span.act{border-bottom-color:#0B7285;font-weight:600;background:#F1F1F1}
.mock-ribbon .groups{display:flex;align-items:stretch;padding:4px 0 0}
.mock-ribbon .grp{display:flex;flex-direction:column;padding:0 5px;border-right:1px solid #DCDCDC}
.mock-ribbon .grp:last-child{border-right:none}
.mock-ribbon .gitems{display:flex;gap:2px;flex:1 1 auto;align-items:flex-start;padding:3px 0 5px}
.mock-ribbon .glabel{text-align:center;font-size:11px;color:#666;padding:2px 0 4px;border-top:1px solid #E6E6E6}
.mock-ribbon .ri{background:none;border:1px solid transparent;border-radius:3px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px;max-width:72px;font-size:11px;line-height:1.2;text-align:center;color:#1A1A1A}
.mock-ribbon .ri .ic{width:22px;height:22px;border:1.5px solid #4A6E8A;border-radius:3px;background:#DCEAF4}
.mock-ribbon .ri.dim{color:#A8A8A8}
.mock-ribbon .ri.dim .ic{border-color:#C4C4C4;background:#EDEDED}
.mock-ribbon .ri .cv{font-size:9px;opacity:.7}
@media (hover:hover){.mock-ribbon .ri:not(.dim):hover{border-color:#7EB5D6;background:#E8F2F9}}
.mock-ribbon .btabs{display:flex;gap:2px;background:#E4E4E4;border-top:1px solid #CFCFCF;padding:3px 6px}
.mock-ribbon .btabs span{font-size:11px;padding:3px 9px;background:#F6F6F6;border:1px solid #D0D0D0;border-bottom:none}
.mock-ribbon .btabs span.act{background:#fff;font-weight:600}

.mock-game{min-width:700px;background:#0A0A0A;color:#D8D2C6;font:14px/1.4 "Segoe UI",Arial,sans-serif;display:flex;min-height:330px}
.mock-game .gside{flex:0 0 190px;padding:20px 16px;border-right:1px solid #241F1A}
.mock-game .gtitle{font:700 13px/1.3 var(--f-mono);letter-spacing:2px;color:#B8A170;margin-bottom:3px}
.mock-game .gver{font-size:10px;color:#6B6357;letter-spacing:1px;margin-bottom:16px}
.mock-game .gside span{display:block;padding:5px 0;font-size:12.5px;letter-spacing:1.4px;color:#8A8175}
.mock-game .gside span.act{color:#E8C87A;font-weight:700}
.mock-game .grows{flex:1 1 auto;padding:14px 18px}
.mock-game .grow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #191510}
.mock-game .grow.act{border:1px solid #6E6250;background:#141210}
.mock-game .grow .gl{flex:1 1 auto;font-size:13.5px}
.mock-game .grow .gv{flex:0 0 74px;text-align:right;font-weight:600;font-size:13px;color:#E8C87A}
.mock-game .grow .gs{flex:0 0 96px;height:9px;border:1px solid #3A332A;background:#0E0C0A;position:relative}
.mock-game .grow .gs i{position:absolute;top:1px;bottom:1px;left:1px;background:#7E7566}
@media (hover:hover){.mock-game .grow:hover{background:#141210}}

.mock-site{min-width:720px;background:#fff;font:14px/1.4 Arial,Helvetica,sans-serif;color:#1A1A1A}
.mock-site .util{display:flex;justify-content:flex-end;gap:15px;padding:7px 16px;font-size:11.5px;color:#555;border-bottom:1px solid #EEE;flex-wrap:wrap}
.mock-site .mainrow{display:flex;align-items:center;gap:18px;padding:12px 16px}
.mock-site .wordmark{font:900 24px/1 Arial,sans-serif;letter-spacing:-1px}
.mock-site .wordmark.camar{color:#D5121B}
.mock-site .tag{font-size:11px;color:#777;letter-spacing:.5px}
.mock-site nav{display:flex;gap:15px;margin-left:auto;flex-wrap:wrap}
.mock-site nav span{font-size:12.5px;color:#222;white-space:nowrap}
.mock-site nav span.up{text-transform:uppercase;letter-spacing:.4px}
.mock-site nav span.on{color:#D5121B;font-weight:700}
.mock-site .mega{background:#57575A;color:#fff;padding:16px;display:flex;gap:14px;flex-wrap:wrap}
.mock-site .mega.light{background:#F4F4F5;color:#1A1A1A;border-top:1px solid #DDD}
.mock-site .mcol{flex:1 1 128px;min-width:118px}
.mock-site .mcol .mh{margin:0 0 5px;font-size:12.5px;line-height:1.3;border-bottom:1px solid #8A8A8D;padding-bottom:5px}
.mock-site .mega.light .mcol .mh{border-bottom-color:#CCC}
.mock-site .mcol ul{margin:0;padding:0;list-style:none;font-size:11.5px;line-height:1.8;color:#E2E2E2}
.mock-site .mega.light .mcol ul{color:#444}
.mock-site .mcol .kicker{font-size:10px;letter-spacing:.8px;color:#C9C9C9;margin:7px 0 2px}
.mock-site .mega.light .mcol .kicker{color:#888}

.mock-calc{min-width:640px;background:#fff;font:14px/1.5 Arial,sans-serif;color:#1A1A1A}
.mock-calc .chead{background:#D5121B;color:#fff;padding:9px 14px;font-weight:700;font-size:14px;letter-spacing:.5px}
.mock-calc .cbody{padding:16px;display:flex;gap:18px;flex-wrap:wrap}
.mock-calc .cside{flex:1 1 250px}
.mock-calc .cfield{margin-bottom:11px}
.mock-calc .cfield label{display:block;font-size:12px;color:#555;margin-bottom:3px}
.mock-calc .cfield .inp{border:1px solid #BBB;background:#FAFAFA;padding:7px 9px;font-size:13px;color:#333;min-height:32px}
.mock-calc .cfield .inp.sel:after{content:"▾";float:right;color:#888}
.mock-calc .cres{flex:1 1 220px;background:#F4F4F5;border:1px solid #DDD;padding:13px}
.mock-calc .cres .big{font:700 26px/1.1 Arial;color:#D5121B;margin:5px 0}
.mock-calc .it{color:#8A6D00;background:#FFF8DC;border-left:3px solid #C9A227;padding:2px 6px;display:inline-block}

.mock-dlg{background:#F0F0F0;border:1px solid #B4B4B4;box-shadow:0 8px 26px rgba(0,0,0,.18);font:13.5px/1.5 "Segoe UI",Arial,sans-serif;color:#1A1A1A;width:100%;max-width:540px}
.mock-dlg .dbar{background:#fff;border-bottom:1px solid #DEDEDE;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}

function icon(name,cls){
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","currentColor");
  s.setAttribute("aria-hidden","true");
  if(cls)s.setAttribute("class",cls);
  var p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",ICONS[name]);
  s.appendChild(p);
  return s;
}

function rich(text){
  var out=frag();
  String(text).split(/(\{[^}]+\}|\[[^\]]+\])/).forEach(function(p){
    if(!p)return;
    if(p.charAt(0)==="{"&&p.slice(-1)==="}")out.appendChild(el("span","k",p.slice(1,-1)));
    else if(p.charAt(0)==="["&&p.slice(-1)==="]")out.appendChild(ruSpan(p.slice(1,-1)));
    else out.appendChild(txt(p));
  });
  return out;
}
function ruSpan(text){
  var s=el("span","ru-hide","перевод");
  s.setAttribute("role","button");
  s.setAttribute("tabindex","0");
  function open(){s.className="ru-open";s.textContent=" "+text+" ";}
  s.addEventListener("click",open);
  s.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  return s;
}

var VOICE=null;
function findVoice(){
  if(VOICE)return VOICE;
  try{
    var v=speechSynthesis.getVoices()||[];
    for(var i=0;i<v.length;i++)if(v[i].lang==="en-GB"){VOICE=v[i];return VOICE;}
    for(var j=0;j<v.length;j++)if(v[j].lang&&v[j].lang.indexOf("en")===0){VOICE=v[j];return VOICE;}
  }catch(e){}
  return null;
}
function sayBtn(word){
  var b=el("button","say");
  b.type="button";
  b.setAttribute("aria-label","Прослушать: "+word);
  b.appendChild(icon("sound"));
  b.addEventListener("click",function(){
    try{
      var u=new SpeechSynthesisUtterance(word);
      u.lang="en-GB";u.rate=.88;
      var v=findVoice();
      if(v)u.voice=v;
      speechSynthesis.cancel();speechSynthesis.speak(u);
    }catch(e){}
  });
  return b;
}
try{speechSynthesis.addEventListener("voiceschanged",function(){VOICE=null;findVoice();});findVoice();}catch(e){}

function setProgress(){
  var n=0;
  SCORED.forEach(function(id){if(S.ans[id])n++;});
  pick("#bar").style.width=Math.round(n/(SCORED.length||1)*100)+"%";
  pick("#score").textContent=S.score+"/"+n+" из "+SCORED.length;
}
function settle(id,correct,o){
  o=o||{};
  var prev=S.ans[id];
  var first=!prev;
  if(first&&correct)S.score++;
  S.ans[id]={ok:!!correct,pick:o.pick,firstOk:first?!!correct:prev.firstOk,firstPick:first?o.pick:prev.firstPick};
  save();setProgress();
  return first;
}
function fbBox(){var b=el("div","fb");b.setAttribute("role","status");b.setAttribute("aria-live","polite");return b;}
function showFb(box,kind,text){box.className="fb on "+kind;box.textContent="";box.appendChild(rich(text));}
function bump(id){TRIES[id]=(TRIES[id]||0)+1;return TRIES[id];}
function hintRow(spec,box){
  if(!spec.hint&&!spec.answer)return null;
  var row=el("div","row");
  if(spec.hint){
    var h=el("button","btn ghost tiny","Подсказка");h.type="button";
    h.addEventListener("click",function(){showFb(box,"hint",spec.hint);});
    row.appendChild(h);
  }
  if(spec.answer){
    var a=el("button","btn ghost tiny","Не помню — покажи");a.type="button";
    a.addEventListener("click",function(){showFb(box,"hint",spec.answer);});
    row.appendChild(a);
  }
  return row;
}
function head(spec){
  var f=frag();
  var q=el("p","q");q.appendChild(rich(spec.q||spec.task||""));f.appendChild(q);
  if(spec.sub){var s=el("p","sub");s.appendChild(rich(spec.sub));f.appendChild(s);}
  return f;
}
function howLine(spec,def){
  var d=el("div","howto");
  d.appendChild(rich(spec.how||def));
  return d;
}

function T(node,en){if(en)node.setAttribute("data-t",en);node.textContent=en||"";return node;}
function tspan(cls,en){return T(el("span",cls),en);}

function mockBox(mockFn,opts){
  opts=opts||{};
  var box=el("div","mockbox");
  var wrap=el("div","mockwrap");
  var node=mockFn();
  if(/mock-(dlg|perm|login|form)/.test(node.className||""))wrap.className="mockwrap pad";
  wrap.appendChild(node);
  box.appendChild(wrap);
  var tools=el("div","mocktools");
  var b=el("button","trbtn");
  b.type="button";
  b.appendChild(icon("globe"));
  var lab=el("span",null,"Перевести весь экран");
  b.appendChild(lab);
  var on=false;
  b.addEventListener("click",function(){
    on=!on;
    var ns=wrap.querySelectorAll("[data-t]");
    for(var i=0;i<ns.length;i++){
      var en=ns[i].getAttribute("data-t");
      ns[i].textContent=on?(TR[en]||en):en;
    }
    b.className=on?"trbtn on":"trbtn";
    lab.textContent=on?"Вернуть английский":"Перевести весь экран";
  });
  tools.appendChild(b);
  tools.appendChild(el("span","hintx",opts.tip||"Весь интерфейс этого экрана станет русским. Сначала попробуй без перевода."));
  box.appendChild(tools);
  return {box:box,wrap:wrap};
}

function mc(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  if(spec.how)c.appendChild(howLine(spec,""));
  var box=fbBox(),opts=el("div","opts"),nodes=[];
  spec.items.forEach(function(it,i){
    var b=el("button","opt");b.type="button";
    b.appendChild(el("span","mk",String.fromCharCode(65+i)));
    var tx=el("span","tx");tx.appendChild(rich(it.t));b.appendChild(tx);
    b.addEventListener("click",function(){choose(i,true);});
    nodes.push(b);opts.appendChild(b);
  });
  function choose(i,sc){
    var it=spec.items[i];
    var kind=it.ok?"ok":(it.near?"near":"bad");
    nodes.forEach(function(n){n.className="opt";});
    nodes[i].className="opt is-"+kind;
    if(it.ok)spec.items.forEach(function(x,j){if(x.ok)nodes[j].className="opt is-ok";});
    showFb(box,kind,it.why||"");
    if(sc){
      var t=bump(spec.id);
      settle(spec.id,!!it.ok,{pick:i});
      if(!it.ok&&t>=3&&spec.hint)showFb(box,"hint",it.why+" — "+spec.hint);
    }
  }
  c.appendChild(opts);c.appendChild(box);
  var h=hintRow(spec,box);if(h)c.appendChild(h);
  if(S.ans[spec.id]&&S.ans[spec.id].pick!=null)choose(S.ans[spec.id].pick,false);
  return c;
}

function match(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  c.appendChild(howLine(spec,"Что делать: нажми слово в левом столбце, потом его пару в правом. Верная пара станет зелёной и погаснет. Собери все."));
  var box=fbBox(),wrap=el("div","pairs"),lc=el("div","col"),rc=el("div","col");
  var sel=null,solved={},L={},R={};
  function mk(t,side,k){
    var b=el("button","chip"+(side==="l"?" en":""));b.type="button";
    b.appendChild(rich(t));
    b.addEventListener("click",function(){tap(side,k,b,true);});
    (side==="l"?L:R)[k]=b;return b;
  }
  spec.left.forEach(function(o){lc.appendChild(mk(o.t,"l",o.k));});
  spec.right.forEach(function(o){rc.appendChild(mk(o.t,"r",o.k));});
  wrap.appendChild(lc);wrap.appendChild(rc);
  function lock(lk,rk){
    solved[lk]=1;
    L[lk].className="chip en is-ok";R[rk].className="chip is-ok";
    L[lk].disabled=true;R[rk].disabled=true;
  }
  function tap(side,k,node,sc){
    if(node.disabled)return;
    if(!sel){sel={side:side,k:k,node:node};node.className+=" sel";return;}
    if(sel.side===side){sel.node.className=sel.node.className.replace(" sel","");sel={side:side,k:k,node:node};node.className+=" sel";return;}
    var lk=sel.side==="l"?sel.k:k, rk=sel.side==="l"?k:sel.k;
    sel.node.className=sel.node.className.replace(" sel","");
    if(spec.pairs[lk]===rk){
      lock(lk,rk);
      var n=0;for(var q in solved)if(solved.hasOwnProperty(q))n++;
      if(n===spec.left.length){
        if(sc)settle(spec.id,true,{pick:"all"});
        showFb(box,"ok",spec.done||"Все пары собраны.");
      }else if(sc)showFb(box,"ok","Верно. Осталось "+(spec.left.length-n)+".");
    }else{
      node.className=side==="l"?"chip en is-bad":"chip is-bad";
      setTimeout(function(){if(!node.disabled)node.className=side==="l"?"chip en":"chip";},700);
      showFb(box,"near",(spec.why&&spec.why[lk])||spec.miss||"Не та пара.");
      if(sc)bump(spec.id);
    }
    sel=null;
  }
  c.appendChild(wrap);c.appendChild(box);
  var h=hintRow(spec,box);if(h)c.appendChild(h);
  if(S.ans[spec.id]){
    for(var k in spec.pairs)if(spec.pairs.hasOwnProperty(k))lock(k,spec.pairs[k]);
    showFb(box,"ok",spec.done||"Все пары собраны.");
  }
  return c;
}

function hotspot(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  c.appendChild(howLine(spec,"Что делать: нажми прямо в макете на то место, куда нажал бы в настоящей программе. Любой ответ объяснят — и верный, и неверный."));
  var box=fbBox();
  var m=mockBox(spec.mock,{tip:spec.tip});
  var zmap={};
  spec.zones.forEach(function(z){zmap[z.z]=z;});
  function land(name,sc){
    var z=zmap[name];
    if(!z){showFb(box,"near",spec.other||"Это не то место. Подумай, в каком разделе по смыслу живёт нужное действие.");return;}
    showFb(box,z.ok?"ok":(z.near?"near":"bad"),z.why||"");
    if(sc){
      var t=bump(spec.id);
      settle(spec.id,!!z.ok,{pick:name});
      if(!z.ok&&t>=3&&spec.hint)showFb(box,"hint",z.why+" — "+spec.hint);
    }
  }
  m.wrap.addEventListener("click",function(e){
    var n=e.target;
    while(n&&n!==m.wrap&&n.getAttribute&&!n.getAttribute("data-zone"))n=n.parentNode;
    e.preventDefault();
    if(!n||n===m.wrap||!n.getAttribute||!n.getAttribute("data-zone")){
      showFb(box,"hint",spec.dead||"Здесь нажимать не на что. Ищи кнопку, вкладку или пункт меню.");
      return;
    }
    land(n.getAttribute("data-zone"),true);
  });
  c.appendChild(m.box);c.appendChild(box);
  var h=hintRow(spec,box);if(h)c.appendChild(h);
  if(S.ans[spec.id]&&S.ans[spec.id].pick)land(S.ans[spec.id].pick,false);
  return c;
}

var STACK_PH=["главное слово — о чём вообще речь","уточнение: какой именно?","ещё уточнение","и последнее уточнение"];
function stack(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var how=el("div","howto");
  how.appendChild(rich(spec.how||"Что делать: нажимай слова по одному снизу. Начни с ГЛАВНОГО слова — в английской надписи оно стоит последним. Потом двигайся справа налево, добавляя уточнения."));
  c.appendChild(how);
  var box=fbBox();
  c.appendChild(el("div","stackphr",spec.phrase));
  var slots=el("div","stackslots"),sn=[],step=0;
  spec.order.forEach(function(o,i){
    var s=el("div","stackslot"+(i===0?" next":""));
    s.appendChild(el("span","n",String(i+1)));
    var t=el("span","tx");
    t.appendChild(el("span","ph",STACK_PH[i]||"уточнение"));
    s.appendChild(t);
    slots.appendChild(s);sn.push(s);
  });
  c.appendChild(slots);
  var toks=el("div","toks"),tn=[];
  spec.order.slice().sort(function(a,b){return a.t<b.t?-1:1;}).forEach(function(o){
    var b=el("button","tok",o.t);b.type="button";
    b.addEventListener("click",function(){tap(o,b,true);});
    tn.push({o:o,b:b});toks.appendChild(b);
  });
  function place(o,b){
    var s=sn[step];
    s.className="stackslot filled";
    var tx=pick(".tx",s);
    tx.textContent="";
    tx.appendChild(rich(o.t+" — "+o.ru));
    b.disabled=true;b.className="tok is-ok";
    step++;
    sn.forEach(function(x,i){
      if(i===step)x.className="stackslot next";
      else if(i>step)x.className="stackslot";
    });
  }
  function tap(o,b,sc){
    if(b.disabled)return;
    if(spec.order[step]&&spec.order[step].t===o.t){
      place(o,b);
      if(step===spec.order.length){
        if(sc)settle(spec.id,true,{pick:"all"});
        showFb(box,"ok",spec.done||("Целиком: "+spec.ru));
      }else if(sc)showFb(box,"ok","Верно. Дальше следующее уточнение.");
    }else{
      b.className="tok is-bad";
      setTimeout(function(){if(!b.disabled)b.className="tok";},700);
      showFb(box,"near",spec.miss||"Начни с последнего слова. Оно главное.");
      if(sc)bump(spec.id);
    }
  }
  c.appendChild(toks);c.appendChild(box);
  var h=hintRow(spec,box);if(h)c.appendChild(h);
  if(S.ans[spec.id]){
    spec.order.forEach(function(o){
      for(var i=0;i<tn.length;i++)if(tn[i].o.t===o.t&&!tn[i].b.disabled){place(o,tn[i].b);break;}
    });
    showFb(box,"ok",spec.done||("Целиком: "+spec.ru));
  }
  return c;
}

function findErr(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  c.appendChild(howLine(spec,"Что делать: два шага. Сначала нажми слово, которое считаешь неверным. Когда найдёшь его — появится второй ряд, выбери в нём замену."));
  var box=fbBox(),toks=el("div","toks"),nodes=[],phase=0;
  spec.tokens.forEach(function(t,i){
    var b=el("button","tok",t);b.type="button";
    b.addEventListener("click",function(){s1(i,true);});
    nodes.push(b);toks.appendChild(b);
  });
  var fw=el("div","toks");fw.style.display="none";
  var fn=[];
  spec.fixes.forEach(function(f,i){
    var b=el("button","tok",f.t);b.type="button";
    b.addEventListener("click",function(){s2(i,true);});
    fn.push(b);fw.appendChild(b);
  });
  function s1(i,sc){
    if(phase>0)return;
    if(i===spec.badIndex){
      nodes[i].className="tok is-ok";
      nodes.forEach(function(n,j){if(j!==i)n.disabled=true;});
      phase=1;
      showFb(box,"ok",spec.found||"Да, ошибка здесь. Чем заменить?");
      fw.style.display="";
    }else{
      nodes[i].className="tok is-bad";
      var b=nodes[i];
      setTimeout(function(){if(!b.disabled)b.className="tok";},700);
      showFb(box,"near",spec.miss||"Это слово здесь уместно. Ищи дальше.");
      if(sc)bump(spec.id);
    }
  }
  function s2(i,sc){
    if(phase>1)return;
    var f=spec.fixes[i];
    fn.forEach(function(n){n.className="tok";});
    fn[i].className="tok "+(f.ok?"is-ok":"is-bad");
    showFb(box,f.ok?"ok":(f.near?"near":"bad"),f.why||"");
    if(f.ok){phase=2;if(sc)settle(spec.id,true,{pick:"done"});}
    else if(sc){bump(spec.id);settle(spec.id,false,{pick:i});}
  }
  c.appendChild(toks);c.appendChild(fw);c.appendChild(box);
  var h=hintRow(spec,box);if(h)c.appendChild(h);
  if(S.ans[spec.id]){
    s1(spec.badIndex,false);
    for(var i=0;i<spec.fixes.length;i++)if(spec.fixes[i].ok){s2(i,false);break;}
  }
  return c;
}

var CH=[];
function ch(o){CH.push(o);}

function buildScored(){
  SCORED=[];
  walkItems(function(it,c,isExtra){if(it.id&&!isExtra)SCORED.push(it.id);});
}
function chapterDone(i){
  var ids=[];
  (CH[i].items||[]).forEach(function(it){if(it.t!=="extra"&&it.id)ids.push(it.id);});
  if(!ids.length)return false;
  var n=0;
  ids.forEach(function(id){if(S.ans[id])n++;});
  return n===ids.length;
}
function renderTabs(){
  var t=pick("#tabs");
  t.textContent="";
  CH.forEach(function(c,i){
    var b=el("button","tab"+(i===S.cur?" on":""));
    b.type="button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected",i===S.cur?"true":"false");
    b.appendChild(el("span","tn",String(i+1)));
    b.appendChild(txt(c.tab));
    if(chapterDone(i))b.appendChild(el("span","tick","✓"));
    b.addEventListener("click",function(){go(i);});
    t.appendChild(b);
  });
  var on=pick(".tab.on",t);
  if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});
}
function renderChapter(){
  var c=CH[S.cur];
  var v=pick("#view");
  v.textContent="";
  var h=el("div","chap-h"),t=el("h1");
  t.appendChild(txt(c.title));
  if(c.mins)t.appendChild(el("span","mins",c.mins+" мин"));
  h.appendChild(t);
  if(c.lead){var l=el("p","lead");l.appendChild(rich(c.lead));h.appendChild(l);}
  v.appendChild(h);
  (c.items||[]).forEach(function(it){
    if(it.t==="extra"){
      var d=el("div","reserve");
      var n=(it.items||[]).length;
      var hh=el("h2","rh");
      hh.appendChild(el("span","lb","ЗАПАС"));
      hh.appendChild(el("span","tt",it.label||"если останется время"));
      hh.appendChild(el("span","ds","Не входит в основной план урока. "+n+" "+(n===1?"задание":(n<5?"задания":"заданий"))+" ниже — берите, если прошли главу быстрее, чем рассчитывали."));
      d.appendChild(hh);
      (it.items||[]).forEach(function(s){d.appendChild(buildItem(s));});
      v.appendChild(d);
    }else v.appendChild(buildItem(it));
  });
  renderTabs();
  t.setAttribute("tabindex","-1");
  try{t.focus({preventScroll:true});}catch(e){}
  v.className="";
  void v.offsetWidth;
  v.className="enter";
  pick("#pmid").textContent="Глава "+(S.cur+1)+" из "+CH.length;
  pick("#prev").disabled=S.cur===0;
  pick("#next").disabled=S.cur===CH.length-1;
  pick("#main").scrollTop=0;
  setProgress();
}
var NAV=false;
function go(n){
  if(n<0||n>=CH.length)return;
  S.cur=n;save();
  NAV=true;
  location.hash="ch"+(n+1);
  NAV=false;
  renderChapter();
}
function renderWelcome(){
  pick("#tabsbar").style.display="none";
  pick("#pagerbar").style.display="none";
  var v=pick("#view");
  v.textContent="";
  var w=el("div","welcome"),wm=el("div","wm");
  wm.appendChild(txt("Interface "));
  wm.appendChild(el("b",null,"English"));
  w.appendChild(wm);
  var lab=el("label");
  lab.appendChild(txt("Your name "));
  lab.appendChild(el("span","req","*"));
  w.appendChild(lab);
  var inp=el("input");
  inp.type="text";
  inp.setAttribute("placeholder","Type your name");
  inp.setAttribute("autocomplete","given-name");
  w.appendChild(inp);
  var b=el("button","btn","Start"),out=el("div","fb");
  b.type="button";
  function submit(){
    var val=inp.value.replace(/^\s+|\s+$/g,"");
    if(!val){showFb(out,"bad","This field is required. — Поле со звёздочкой нельзя оставить пустым. Ты только что увидел, как это работает во всех формах.");return;}
    S.name=val;save();
    pick("#tabsbar").style.display="";
    pick("#pagerbar").style.display="";
    go(S.cur||0);
  }
  b.addEventListener("click",submit);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  w.appendChild(b);
  w.appendChild(out);
  v.appendChild(w);
  try{inp.focus();}catch(e){}
}

  if(NAV||!S.name)return;

});

function boot(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p&&typeof p==="object"){
        S.name=p.name||"";S.score=p.score||0;S.ans=p.ans||{};S.cur=p.cur||0;
      }
    }
  }catch(e){}
  buildScored();
  var m=/^#ch(\d+)$/.exec(location.hash||"");
  if(m){var n=parseInt(m[1],10)-1;if(n>=0&&n<CH.length)S.cur=n;}
  if(S.cur>=CH.length)S.cur=0;
  if(!S.name)renderWelcome();
  else renderChapter();
  setProgress();
}
boot();
</script>
