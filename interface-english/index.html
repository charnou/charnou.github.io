<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Interface English</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  color-scheme:light only;
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E3E6EC; --line-soft:#EFF1F5;
  --ink:#16181D; --ink-soft:#4A5060; --ink-muted:#7A8194;
  --acc:#4F46E5; --acc-ink:#3730A3; --acc-tint:#EEF0FE;
  --ok:#12866F; --ok-ink:#0B5E4E; --ok-tint:#E6F6F2;
  --near:#B4690E; --near-ink:#8A5009; --near-tint:#FDF3E3;
  --bad:#C0392B; --bad-ink:#8E2A20; --bad-tint:#FBEDEB;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,18,29,.06),0 8px 24px rgba(16,18,29,.06);
  --ease:cubic-bezier(.33,1,.68,1);
  --font-display:"Segoe UI Semibold","Helvetica Neue",Arial,sans-serif;
  --font-ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:16px/1.55 var(--font-ui);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}
.card>*:not(.mockwrap){max-width:820px}
.lead{max-width:860px}

.top{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.top-in{display:flex;align-items:center;gap:14px;height:58px}
.brand{font:600 17px/1 var(--font-display);letter-spacing:-.2px;white-space:nowrap}
.brand b{color:var(--acc)}
.meter{flex:1 1 auto;height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .45s var(--ease)}
.score{font:600 14px/1 var(--font-mono);color:var(--ink-soft);white-space:nowrap}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-muted)}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;scroll-behavior:smooth}
main>.wrap{padding-bottom:80px}

.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:20px 0;overflow:hidden}
.blk-h{padding:18px 22px 14px;border-bottom:1px solid var(--line-soft)}
.blk-h h2{margin:0;font:600 20px/1.3 var(--font-display);letter-spacing:-.3px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--acc-tint);color:var(--acc-ink);font:600 13px/1 var(--font-mono)}
.mins{margin-left:auto;font:500 12px/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
.lead{margin:8px 0 0;color:var(--ink-soft);font-size:15px}
.blk-b{padding:6px 22px 22px}

.ru{font-family:var(--font-ui);font-size:14.5px;color:var(--ink-soft)}
.ru-hide{font-size:13px;color:var(--acc);border-bottom:1px dashed var(--acc);cursor:pointer;white-space:nowrap}
.ru-hide:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.en{font-family:var(--font-mono);font-weight:600}
.k{font-family:var(--font-mono);font-size:.92em;background:var(--acc-tint);color:var(--acc-ink);border-radius:5px;padding:1px 4px;white-space:nowrap}

.card{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;margin:14px 0;background:var(--card)}
.card>h3{margin:0 0 8px;font:600 15px/1.35 var(--font-display)}
.q{margin:0 0 4px;font-weight:600;font-size:16px}
.q .task{color:var(--acc-ink)}
.sub{margin:2px 0 12px;font-size:14px;color:var(--ink-muted)}

.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;transition:border-color .15s,background .15s}
.opt .mk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-mono);color:var(--ink-muted)}
.opt .tx{flex:1 1 auto}
.opt.is-ok{border-color:var(--ok);background:var(--ok-tint)}
.opt.is-ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-tint)}
.opt.is-bad .mk{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.is-near{border-color:var(--near);background:var(--near-tint)}
.opt.is-near .mk{border-color:var(--near);background:var(--near);color:#fff}
@media (hover:hover){.opt:hover{border-color:var(--acc)}}

.fb{margin:12px 0 0;padding:11px 13px;border-radius:var(--r-sm);font-size:14.5px;display:none}
.fb.on{display:block}
.fb.ok{background:var(--ok-tint);color:var(--ok-ink);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-tint);color:var(--bad-ink);border:1px solid var(--bad)}
.fb.near{background:var(--near-tint);color:var(--near-ink);border:1px solid var(--near)}
.fb.hint{background:var(--acc-tint);color:var(--acc-ink);border:1px solid var(--acc)}
.fb b{font-family:var(--font-mono)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600}
.btn.ghost{background:none;color:var(--acc-ink);border-color:var(--line)}
.btn.tiny{padding:5px 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:default}
.say{background:none;border:none;padding:0 4px;font-size:14px;line-height:1;opacity:.6}
@media (hover:hover){.say:hover{opacity:1}}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:12px 0 0}
.word{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--card)}
.word .w{font:600 15px/1.3 var(--font-mono)}
.word .d{font-size:13.5px;color:var(--ink-soft);margin-top:2px}

.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0 0}
.fam>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--card)}
.fam h4{margin:0 0 6px;font:600 14px/1.3 var(--font-display)}
.fam ul{margin:0;padding-left:18px;font-family:var(--font-mono);font-size:13.5px;line-height:1.7}

.pairs{display:flex;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.col{flex:1 1 200px;display:flex;flex-direction:column;gap:7px;min-width:180px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:9px 12px;text-align:left;font-size:14.5px;transition:border-color .15s,background .15s}
.chip.en{font-family:var(--font-mono);font-weight:600}
.chip.sel{border-color:var(--acc);background:var(--acc-tint)}
.chip.is-ok{border-color:var(--ok);background:var(--ok-tint);cursor:default}
.chip.is-bad{border-color:var(--bad);background:var(--bad-tint)}
.chip[disabled]{cursor:default}
@media (hover:hover){.chip:not([disabled]):hover{border-color:var(--acc)}}

.gapline{font-size:16px;line-height:2.1;margin:12px 0 0}
.slot{display:inline-block;min-width:120px;border-bottom:2px solid var(--acc);text-align:center;font-family:var(--font-mono);font-weight:600;color:var(--acc-ink);padding:0 6px}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font:600 14px/1.2 var(--font-mono)}
.tok.is-ok{border-color:var(--ok);background:var(--ok-tint)}
.tok.is-bad{border-color:var(--bad);background:var(--bad-tint)}
.tok.sel{border-color:var(--acc);background:var(--acc-tint)}

.stackbox{margin:12px 0 0}
.stackphr{font:600 19px/1.4 var(--font-mono);letter-spacing:-.2px;padding:12px 14px;background:var(--acc-tint);border-radius:var(--r-sm);color:var(--acc-ink)}
.stackslots{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.stackslot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:44px;font-size:14.5px}
.stackslot .n{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--line-soft);color:var(--ink-muted);font:600 12px/22px var(--font-mono);text-align:center}
.stackslot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-tint)}

details.extra{border:1px dashed var(--line);border-radius:var(--r-sm);margin:14px 0;background:#FCFCFD}
details.extra>summary{cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--ink-muted);font-weight:600;list-style:none}
details.extra>summary::-webkit-details-marker{display:none}
details.extra>summary:before{content:"EXTRA · ";font-family:var(--font-mono);color:var(--acc)}
details.extra>div{padding:0 14px 6px}

details.talk{border:1px solid var(--near);background:var(--near-tint);border-radius:var(--r-sm);margin:14px 0}
details.talk>summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14.5px;color:var(--near-ink);list-style:none}
details.talk>summary::-webkit-details-marker{display:none}
details.talk>summary:before{content:"🗣 ";}
details.talk>div{padding:0 14px 12px;font-size:14.5px;color:var(--near-ink)}
details.talk ul{margin:6px 0 0;padding-left:20px}

.rule{display:flex;gap:12px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r-sm);padding:13px 15px;margin:10px 0;background:var(--card)}
.rule .rn{flex:0 0 auto;font:600 22px/1 var(--font-display);color:var(--acc);opacity:.5}
.rule h4{margin:0 0 4px;font:600 15px/1.35 var(--font-display)}
.rule p{margin:0;font-size:14.5px;color:var(--ink-soft)}

.sig{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:14.5px}
.sig td,.sig th{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.sig th{background:var(--line-soft);font-weight:600;font-size:13px}
.sig td:first-child{font-family:var(--font-mono);font-weight:600;white-space:nowrap;width:1%}

.mockwrap{margin:12px 0 0;border-radius:var(--r-sm);overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line)}
.mockwrap.plain{border:none}

.mock-ribbon{min-width:760px;background:#F1F1F1;font:13px/1.3 "Segoe UI",Arial,sans-serif;color:#1A1A1A}
.mock-ribbon .title{background:#fff;padding:5px 10px;font-size:12px;color:#444;display:flex;justify-content:space-between;border-bottom:1px solid #DDD}
.mock-ribbon .title .logo{font-weight:700;color:#0B7285}
.mock-ribbon .tabs{display:flex;background:#fff;border-bottom:1px solid #CFCFCF}
.mock-ribbon .tabs button{background:none;border:none;padding:7px 15px;font-size:13px;color:#1A1A1A;border-bottom:2px solid transparent}
.mock-ribbon .tabs button.file{background:#217346;color:#fff}
.mock-ribbon .tabs button.act{border-bottom-color:#0B7285;font-weight:600;background:#F1F1F1}
.mock-ribbon .groups{display:flex;align-items:stretch;padding:4px 0 0}
.mock-ribbon .grp{display:flex;flex-direction:column;padding:0 5px;border-right:1px solid #DCDCDC}
.mock-ribbon .grp:last-child{border-right:none}
.mock-ribbon .gitems{display:flex;gap:2px;flex:1 1 auto;align-items:flex-start;padding:3px 0 5px}
.mock-ribbon .glabel{text-align:center;font-size:11px;color:#666;padding:2px 0 4px;border-top:1px solid #E6E6E6}
.mock-ribbon .ri{background:none;border:1px solid transparent;border-radius:3px;padding:4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px;max-width:70px;font-size:11px;line-height:1.2;text-align:center;color:#1A1A1A}
.mock-ribbon .ri .ic{width:22px;height:22px;border:1.5px solid #4A6E8A;border-radius:3px;background:#DCEAF4}
.mock-ribbon .ri.dim{color:#A8A8A8}
.mock-ribbon .ri.dim .ic{border-color:#C4C4C4;background:#EDEDED}
.mock-ribbon .ri .cv{font-size:9px;opacity:.7}
@media (hover:hover){.mock-ribbon .ri:not(.dim):hover{border-color:#7EB5D6;background:#E8F2F9}}
.mock-ribbon .btabs{display:flex;gap:2px;background:#E4E4E4;border-top:1px solid #CFCFCF;padding:3px 6px}
.mock-ribbon .btabs span{font-size:11px;padding:3px 9px;background:#F6F6F6;border:1px solid #D0D0D0;border-bottom:none}
.mock-ribbon .btabs span.act{background:#fff;font-weight:600}

.mock-game{min-width:700px;background:#0A0A0A;color:#D8D2C6;font:14px/1.4 "Segoe UI",Arial,sans-serif;display:flex;min-height:330px}
.mock-game .gside{flex:0 0 190px;padding:22px 16px;border-right:1px solid #241F1A}
.mock-game .gtitle{font:700 13px/1.3 var(--font-mono);letter-spacing:2px;color:#B8A170;margin-bottom:4px}
.mock-game .gver{font-size:10px;color:#6B6357;letter-spacing:1px;margin-bottom:18px}
.mock-game .gside button{display:block;width:100%;text-align:left;background:none;border:none;padding:5px 0;font-size:12.5px;letter-spacing:1.4px;color:#8A8175}
.mock-game .gside button.act{color:#E8C87A;font-weight:700}
.mock-game .grows{flex:1 1 auto;padding:16px 18px}
.mock-game .grow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #191510}
.mock-game .grow.act{border:1px solid #6E6250;background:#141210}
.mock-game .grow .gl{flex:1 1 auto;font-size:13.5px}
.mock-game .grow .gv{flex:0 0 74px;text-align:right;font-weight:600;font-size:13px;color:#E8C87A}
.mock-game .grow .gs{flex:0 0 96px;height:9px;border:1px solid #3A332A;background:#0E0C0A;position:relative}
.mock-game .grow .gs i{position:absolute;top:1px;bottom:1px;left:1px;background:#7E7566;width:34%}
@media (hover:hover){.mock-game .grow:hover{background:#141210}}

.mock-site{min-width:720px;background:#fff;font:14px/1.4 Arial,Helvetica,sans-serif;color:#1A1A1A}
.mock-site .util{display:flex;justify-content:flex-end;gap:16px;padding:7px 16px;font-size:11.5px;color:#555;border-bottom:1px solid #EEE}
.mock-site .mainrow{display:flex;align-items:center;gap:18px;padding:12px 16px}
.mock-site .wordmark{font:900 24px/1 Arial,sans-serif;letter-spacing:-1px}
.mock-site .wordmark.camar{color:#D5121B}
.mock-site .tag{font-size:11px;color:#777;letter-spacing:.5px}
.mock-site nav{display:flex;gap:15px;margin-left:auto;flex-wrap:wrap}
.mock-site nav span{font-size:12.5px;color:#222;white-space:nowrap}
.mock-site nav span.up{text-transform:uppercase;letter-spacing:.4px}
.mock-site nav span.on{color:#D5121B;font-weight:700}
.mock-site .mega{background:#57575A;color:#fff;padding:16px;display:flex;gap:14px;flex-wrap:wrap}
.mock-site .mcol{flex:1 1 128px;min-width:120px}
.mock-site .mcol h5{margin:0 0 5px;font-size:12.5px;line-height:1.3;border-bottom:1px solid #8A8A8D;padding-bottom:5px}
.mock-site .mcol .sub{margin:0;padding:0;list-style:none;font-size:11.5px;line-height:1.75;color:#E2E2E2}
.mock-site .mcol .kicker{font-size:10px;letter-spacing:.8px;color:#C9C9C9;margin-top:6px}
.mock-site .zone{border:none;background:none;padding:0;color:inherit;font:inherit;text-align:left;display:block;width:100%}
@media (hover:hover){.mock-site .zone:hover{text-decoration:underline}}

.mock-dlg{background:#F0F0F0;border:1px solid #B4B4B4;font:13.5px/1.5 "Segoe UI",Arial,sans-serif;color:#1A1A1A;max-width:520px;margin:0 auto}
.mock-dlg .dbar{background:#fff;border-bottom:1px solid #DEDEDE;padding:8px 12px;display:flex;align-items:center;font-size:12.5px;font-weight:600}
.mock-dlg .dbar .x{margin-left:auto;border:none;background:none;font-size:15px;line-height:1;padding:0 4px;color:#555}
.mock-dlg .dbody{padding:18px;background:#fff;display:flex;gap:13px}
.mock-dlg .dbody .ico{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#FDF3E3;color:#B4690E;font:700 18px/30px Arial;text-align:center}
.mock-dlg .dbody .ico.warn{background:#FBEDEB;color:#C0392B}
.mock-dlg .dfoot{padding:11px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #E0E0E0;flex-wrap:wrap}
.mock-dlg .db{border:1px solid #ADADAD;background:#E8E8E8;border-radius:3px;padding:6px 16px;font-size:13px;min-width:84px}
.mock-dlg .db.pri{border-color:#0B5FA5;background:#0B5FA5;color:#fff;font-weight:600}
.mock-dlg .db.dgr{border-color:#B03A2E;background:#C0392B;color:#fff}
@media (hover:hover){.mock-dlg .db:hover{border-color:#0B5FA5}}
.mock-dlg .opt-line{display:flex;align-items:flex-start;gap:8px;margin:7px 0;font-size:13px}
.mock-dlg .bx{flex:0 0 auto;width:14px;height:14px;border:1px solid #767676;background:#fff;margin-top:2px}
.mock-dlg .bx.rad{border-radius:50%}
.mock-dlg .bx.chk{background:#0B5FA5;border-color:#0B5FA5;color:#fff;font:700 10px/12px Arial;text-align:center}
.mock-dlg .bx.dot{position:relative}
.mock-dlg .bx.dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0B5FA5}

.mock-cookie{background:#1F2430;color:#E8EAF0;font:13.5px/1.55 Arial,sans-serif;padding:18px}
.mock-cookie h5{margin:0 0 6px;font-size:15px}
.mock-cookie p{margin:0 0 12px;color:#B4BACB;font-size:13px}
.mock-cookie .crow{display:flex;gap:8px;flex-wrap:wrap}
.mock-cookie .cb{border:1px solid #4A5266;background:none;color:#E8EAF0;border-radius:4px;padding:8px 15px;font-size:13px}
.mock-cookie .cb.pri{background:#3B82F6;border-color:#3B82F6;color:#fff;font-weight:600}
@media (hover:hover){.mock-cookie .cb:hover{border-color:#8FA0C4}}

.mock-perm{background:#fff;border:1px solid #C6C6C6;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.16);max-width:400px;font:13.5px/1.5 "Segoe UI",Arial,sans-serif}
.mock-perm .purl{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid #EDEDED;font-size:12.5px;color:#444}
.mock-perm .pbody{padding:14px 13px}
.mock-perm .pfoot{display:flex;gap:8px;justify-content:flex-end;padding:0 13px 13px;flex-wrap:wrap}
.mock-perm .pb{border:1px solid #C6C6C6;background:#fff;border-radius:4px;padding:6px 13px;font-size:13px}
.mock-perm .pb.pri{background:#0B57D0;border-color:#0B57D0;color:#fff;font-weight:600}

.done{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--font-mono);color:var(--ok-ink);background:var(--ok-tint);border:1px solid var(--ok);border-radius:999px;padding:4px 9px;margin-left:auto}

.mist{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;margin:10px 0}
.mist .mq{font-weight:600;font-size:14.5px;margin-bottom:6px}
.mist .ml{font-family:var(--font-mono);font-size:13.5px;margin:2px 0}
.mist .ml.mine{color:var(--bad-ink)}
.mist .ml.right{color:var(--ok-ink)}
.mist .mw{font-size:13.5px;color:var(--ink-soft);margin-top:5px}

.sheet{border:2px solid var(--acc);border-radius:var(--r-sm);padding:18px;margin:14px 0;background:#fff}
.sheet h3{margin:0 0 12px;font:600 18px/1.3 var(--font-display)}
.sheet h4{margin:16px 0 6px;font:600 14px/1.3 var(--font-display);color:var(--acc-ink);text-transform:uppercase;letter-spacing:.5px;font-size:12px}
.sheet ul{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
.sheet .mono{font-family:var(--font-mono);font-weight:600}
.sheet .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 22px}

.final{text-align:center;padding:10px 0}
.final .big{font:700 44px/1 var(--font-display);color:var(--acc)}
.final .verdict{font-size:16px;margin-top:10px;color:var(--ink-soft)}

.gate{max-width:440px;margin:30px auto}
.gate label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.gate .req{color:var(--bad);font-family:var(--font-mono)}
.gate input{width:100%;font:17px/1.4 var(--font-ui);padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink)}
.gate input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.gate .hintline{font-size:13px;color:var(--ink-muted);margin-top:7px}

@media (max-width:640px){
  .wrap{padding:0 14px}
  .blk-h,.blk-b{padding-left:15px;padding-right:15px}
  .brand{font-size:15px}
  .mins{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  body{height:auto;overflow:visible;display:block;background:#fff}
  .top,main>.wrap>.blk:not(.printable),.row,.reset,details.extra,details.talk{display:none!important}
  main{overflow:visible}
  .blk.printable{border:none;box-shadow:none;margin:0;page-break-inside:avoid}
  .ru-hide{display:none}
  .mins{display:none}
  .sheet{border:1px solid #999}
  .mist{page-break-inside:avoid}
}
</style>

<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">Interface <b>English</b></div>
    <div class="meter" role="progressbar" aria-label="Прогресс урока"><i id="bar"></i></div>
    <div class="score" id="score">0 / 0</div>
    <button class="reset" id="reset" type="button">Сброс</button>
  </div>
</header>
<main id="main"><div class="wrap" id="app"></div></main>

<script>
"use strict";

var KEY="interface-english-v2";
var S={name:"",score:0,ans:{},open:{}};
var SCORED=[];
var TRIES={};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function el(tag,cls,txt){
  var n=document.createElement(tag);
  if(cls)n.className=cls;
  if(txt!=null)n.textContent=txt;
  return n;
}
function frag(){return document.createDocumentFragment();}
function pick(sel,root){return (root||document).querySelector(sel);}

function rich(text){
  var out=frag();
  var parts=String(text).split(/(\{[^}]+\}|\[[^\]]+\])/);
  parts.forEach(function(p){
    if(!p)return;
    if(p.charAt(0)==="{"&&p.slice(-1)==="}"){out.appendChild(el("span","k",p.slice(1,-1)));}
    else if(p.charAt(0)==="["&&p.slice(-1)==="]"){out.appendChild(ruSpan(p.slice(1,-1)));}
    else{out.appendChild(document.createTextNode(p));}
  });
  return out;
}

function ruSpan(text){
  var s=el("span","ru-hide","перевод");
  s.setAttribute("role","button");
  s.setAttribute("tabindex","0");
  function open(){s.className="ru";s.textContent=" "+text+" ";}
  s.addEventListener("click",open);
  s.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}
  });
  return s;
}

var VOICE=null;
function findVoice(){
  if(VOICE)return VOICE;
  try{
    var vs=speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++){if(vs[i].lang==="en-GB"){VOICE=vs[i];return VOICE;}}
    for(var j=0;j<vs.length;j++){if(vs[j].lang&&vs[j].lang.indexOf("en")===0){VOICE=vs[j];return VOICE;}}
  }catch(e){}
  return null;
}
function sayBtn(word){
  var b=el("button","say","🔊");
  b.type="button";
  b.setAttribute("aria-label","Listen: "+word);
  b.addEventListener("click",function(){
    try{
      var u=new SpeechSynthesisUtterance(word);
      u.lang="en-GB";u.rate=.88;
      var v=findVoice();
      if(v)u.voice=v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){}
  });
  return b;
}
try{speechSynthesis.addEventListener("voiceschanged",function(){VOICE=null;findVoice();});findVoice();}catch(e){}

function setProgress(){
  var n=0;
  SCORED.forEach(function(id){if(S.ans[id])n++;});
  var total=SCORED.length||1;
  pick("#bar").style.width=Math.round(n/total*100)+"%";
  pick("#score").textContent="✓ "+S.score+" · "+n+"/"+total;
}

function settle(id,correct,o){
  o=o||{};
  var prev=S.ans[id];
  var first=!prev;
  if(first&&correct)S.score++;
  S.ans[id]={
    ok:!!correct,
    pick:o.pick,
    firstOk:first?!!correct:prev.firstOk,
    firstPick:first?o.pick:prev.firstPick
  };
  save();
  setProgress();
  return first;
}

function fbBox(){return el("div","fb");}
function showFb(box,kind,text){
  box.className="fb on "+kind;
  box.textContent="";
  box.appendChild(rich(text));
}

function bump(id){TRIES[id]=(TRIES[id]||0)+1;return TRIES[id];}

function hintRow(spec,box){
  if(!spec.hint&&!spec.answer)return null;
  var row=el("div","row");
  if(spec.hint){
    var h=el("button","btn ghost tiny","Подсказка");
    h.type="button";
    h.addEventListener("click",function(){showFb(box,"hint",spec.hint);});
    row.appendChild(h);
  }
  if(spec.answer){
    var a=el("button","btn ghost tiny","Не помню — покажи");
    a.type="button";
    a.addEventListener("click",function(){showFb(box,"hint",spec.answer);});
    row.appendChild(a);
  }
  return row;
}

function head(spec){
  var f=frag();
  var q=el("p","q");
  q.appendChild(rich(spec.q||spec.task||""));
  f.appendChild(q);
  if(spec.sub){var s=el("p","sub");s.appendChild(rich(spec.sub));f.appendChild(s);}
  return f;
}

function mc(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var opts=el("div","opts");
  var nodes=[];
  spec.items.forEach(function(it,i){
    var b=el("button","opt");
    b.type="button";
    var mk=el("span","mk",String.fromCharCode(65+i));
    var tx=el("span","tx");
    tx.appendChild(rich(it.t));
    b.appendChild(mk);b.appendChild(tx);
    b.addEventListener("click",function(){choose(i,true);});
    nodes.push(b);
    opts.appendChild(b);
  });
  function choose(i,scoring){
    var it=spec.items[i];
    var kind=it.ok?"ok":(it.near?"near":"bad");
    nodes.forEach(function(n){n.className="opt";});
    nodes[i].className="opt is-"+kind;
    if(it.ok){
      spec.items.forEach(function(x,j){if(x.ok)nodes[j].className="opt is-ok";});
    }
    showFb(box,kind,it.why||"");
    if(scoring){
      var t=bump(spec.id);
      settle(spec.id,!!it.ok,{pick:i});
      if(!it.ok&&t>=3&&spec.hint)showFb(box,"hint",it.why+" — "+spec.hint);
    }
  }
  c.appendChild(opts);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]&&S.ans[spec.id].pick!=null)choose(S.ans[spec.id].pick,false);
  return c;
}

function match(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var wrap=el("div","pairs");
  var lc=el("div","col"),rc=el("div","col");
  var sel=null,solved={},lnodes={},rnodes={};
  function mk(text,side,key){
    var b=el("button","chip"+(side==="l"?" en":""));
    b.type="button";
    b.appendChild(rich(text));
    b.addEventListener("click",function(){tap(side,key,b,true);});
    (side==="l"?lnodes:rnodes)[key]=b;
    return b;
  }
  spec.left.forEach(function(o){lc.appendChild(mk(o.t,"l",o.k));});
  spec.right.forEach(function(o){rc.appendChild(mk(o.t,"r",o.k));});
  wrap.appendChild(lc);wrap.appendChild(rc);
  function lock(lk,rk){
    solved[lk]=1;
    lnodes[lk].className="chip en is-ok";rnodes[rk].className="chip is-ok";
    lnodes[lk].disabled=true;rnodes[rk].disabled=true;
  }
  function tap(side,key,node,scoring){
    if(node.disabled)return;
    if(!sel){sel={side:side,key:key,node:node};node.className+=" sel";return;}
    if(sel.side===side){sel.node.className=sel.node.className.replace(" sel","");sel={side:side,key:key,node:node};node.className+=" sel";return;}
    var lk=sel.side==="l"?sel.key:key;
    var rk=sel.side==="l"?key:sel.key;
    sel.node.className=sel.node.className.replace(" sel","");
    if(spec.pairs[lk]===rk){
      lock(lk,rk);
      var n=0;for(var q in solved)if(solved.hasOwnProperty(q))n++;
      var total=spec.left.length;
      if(n===total){
        if(scoring)settle(spec.id,true,{pick:"all"});
        showFb(box,"ok",spec.done||"Все пары собраны.");
      }else if(scoring){
        showFb(box,"ok","Верно. Осталось: "+(total-n)+".");
      }
    }else{
      node.className=side==="l"?"chip en is-bad":"chip is-bad";
      var self=node;
      setTimeout(function(){if(!self.disabled)self.className=side==="l"?"chip en":"chip";},700);
      var why=(spec.why&&spec.why[lk])||spec.miss||"Не та пара.";
      showFb(box,"near",why);
      if(scoring)bump(spec.id);
    }
    sel=null;
  }
  c.appendChild(wrap);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]){
    for(var k in spec.pairs)if(spec.pairs.hasOwnProperty(k))lock(k,spec.pairs[k]);
    showFb(box,"ok",spec.done||"Все пары собраны.");
  }
  return c;
}

function hotspot(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var holder=el("div","mockwrap");
  holder.appendChild(spec.mock());
  var zmap={};
  spec.zones.forEach(function(z){zmap[z.z]=z;});
  function land(name,scoring){
    var z=zmap[name];
    if(!z){
      showFb(box,"near",spec.other||"Это не то место. Посмотри ещё раз, где живёт нужное действие.");
      return;
    }
    showFb(box,z.ok?"ok":"bad",z.why||"");
    if(scoring){
      var t=bump(spec.id);
      settle(spec.id,!!z.ok,{pick:name});
      if(!z.ok&&t>=3&&spec.hint)showFb(box,"hint",z.why+" — "+spec.hint);
    }
  }
  holder.addEventListener("click",function(e){
    var n=e.target;
    while(n&&n!==holder&&n.getAttribute&&!n.getAttribute("data-zone"))n=n.parentNode;
    e.preventDefault();
    if(!n||n===holder||!n.getAttribute||!n.getAttribute("data-zone")){
      showFb(box,"hint",spec.dead||"Здесь нажимать не на что. Ищи кнопку, вкладку или пункт меню — то, на что в настоящей программе реально нажимают.");
      return;
    }
    land(n.getAttribute("data-zone"),true);
  });
  c.appendChild(holder);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]&&S.ans[spec.id].pick)land(S.ans[spec.id].pick,false);
  return c;
}

function stack(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var sb=el("div","stackbox");
  var phr=el("div","stackphr",spec.phrase);
  sb.appendChild(phr);
  var slots=el("div","stackslots");
  var step=0;
  var slotNodes=[];
  spec.order.forEach(function(o,i){
    var s=el("div","stackslot");
    s.appendChild(el("span","n",String(i+1)));
    s.appendChild(el("span","tx",""));
    slots.appendChild(s);
    slotNodes.push(s);
  });
  sb.appendChild(slots);
  var toks=el("div","toks");
  var tokNodes=[];
  var shuffled=spec.order.slice().sort(function(a,b){return a.t<b.t?-1:1;});
  shuffled.forEach(function(o){
    var b=el("button","tok",o.t);
    b.type="button";
    b.addEventListener("click",function(){tap(o,b,true);});
    tokNodes.push({o:o,b:b});
    toks.appendChild(b);
  });
  function place(o,b){
    var s=slotNodes[step];
    s.className="stackslot filled";
    pick(".tx",s).textContent="";
    pick(".tx",s).appendChild(rich(o.t+" — "+o.ru));
    b.disabled=true;b.className="tok is-ok";
    step++;
  }
  function tap(o,b,scoring){
    if(b.disabled)return;
    if(spec.order[step]&&spec.order[step].t===o.t){
      place(o,b);
      if(step===spec.order.length){
        if(scoring)settle(spec.id,true,{pick:"all"});
        showFb(box,"ok",spec.done||("Целиком: "+spec.ru));
      }else if(scoring){
        showFb(box,"ok","Верно. Дальше — следующее уточнение.");
      }
    }else{
      b.className="tok is-bad";
      setTimeout(function(){if(!b.disabled)b.className="tok";},700);
      showFb(box,"near",spec.miss||"Начни с последнего слова — оно главное. Потом двигайся налево.");
      if(scoring)bump(spec.id);
    }
  }
  sb.appendChild(toks);
  c.appendChild(sb);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]){
    tokNodes.forEach(function(){});
    spec.order.forEach(function(o){
      for(var i=0;i<tokNodes.length;i++){
        if(tokNodes[i].o.t===o.t&&!tokNodes[i].b.disabled){place(o,tokNodes[i].b);break;}
      }
    });
    showFb(box,"ok",spec.done||("Целиком: "+spec.ru));
  }
  return c;
}

function gap(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var line=el("p","gapline");
  line.appendChild(rich(spec.before));
  var slot=el("span","slot","?");
  line.appendChild(slot);
  line.appendChild(rich(spec.after||""));
  c.appendChild(line);
  var toks=el("div","toks");
  var nodes=[];
  spec.chips.forEach(function(ch,i){
    var b=el("button","tok",ch.t);
    b.type="button";
    b.addEventListener("click",function(){choose(i,true);});
    nodes.push(b);
    toks.appendChild(b);
  });
  function choose(i,scoring){
    var ch=spec.chips[i];
    nodes.forEach(function(n){n.className="tok";});
    nodes[i].className="tok "+(ch.ok?"is-ok":"is-bad");
    slot.textContent=ch.t;
    showFb(box,ch.ok?"ok":(ch.near?"near":"bad"),ch.why||"");
    if(scoring){
      var t=bump(spec.id);
      settle(spec.id,!!ch.ok,{pick:i});
      if(!ch.ok&&t>=3&&spec.hint)showFb(box,"hint",spec.hint);
    }
  }
  c.appendChild(toks);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]&&S.ans[spec.id].pick!=null)choose(S.ans[spec.id].pick,false);
  return c;
}

function findErr(spec){
  var c=el("div","card");
  c.appendChild(head(spec));
  var box=fbBox();
  var toks=el("div","toks");
  var nodes=[];
  var phase=0;
  spec.tokens.forEach(function(t,i){
    var b=el("button","tok",t);
    b.type="button";
    b.addEventListener("click",function(){step1(i,true);});
    nodes.push(b);
    toks.appendChild(b);
  });
  var fixWrap=el("div","toks");
  fixWrap.style.display="none";
  var fixNodes=[];
  spec.fixes.forEach(function(f,i){
    var b=el("button","tok",f.t);
    b.type="button";
    b.addEventListener("click",function(){step2(i,true);});
    fixNodes.push(b);
    fixWrap.appendChild(b);
  });
  function step1(i,scoring){
    if(phase>0)return;
    if(i===spec.badIndex){
      nodes[i].className="tok is-ok";
      nodes.forEach(function(n,j){if(j!==i)n.disabled=true;});
      phase=1;
      showFb(box,"ok",spec.found||"Да, ошибка здесь. Теперь выбери, чем заменить.");
      fixWrap.style.display="";
    }else{
      nodes[i].className="tok is-bad";
      var b=nodes[i];
      setTimeout(function(){if(!b.disabled)b.className="tok";},700);
      showFb(box,"near",spec.miss||"Это слово здесь уместно. Ищи дальше.");
      if(scoring)bump(spec.id);
    }
  }
  function step2(i,scoring){
    if(phase>1)return;
    var f=spec.fixes[i];
    fixNodes.forEach(function(n){n.className="tok";});
    fixNodes[i].className="tok "+(f.ok?"is-ok":"is-bad");
    showFb(box,f.ok?"ok":(f.near?"near":"bad"),f.why||"");
    if(f.ok){
      phase=2;
      if(scoring)settle(spec.id,true,{pick:"done"});
    }else if(scoring){
      bump(spec.id);
      settle(spec.id,false,{pick:"wrongfix"});
    }
  }
  c.appendChild(toks);
  c.appendChild(fixWrap);
  c.appendChild(box);
  var hr=hintRow(spec,box);
  if(hr)c.appendChild(hr);
  if(!spec.extraOnly)SCORED.push(spec.id);
  if(S.ans[spec.id]){
    step1(spec.badIndex,false);
    for(var i=0;i<spec.fixes.length;i++)if(spec.fixes[i].ok){step2(i,false);break;}
  }
  return c;
}

function note(spec){
  var c=el("div","card");
  if(spec.h)c.appendChild(el("h3",null,spec.h));
  (spec.body||[]).forEach(function(p){
    var n=el("p");
    n.style.margin="0 0 8px";
    n.style.fontSize="14.5px";
    n.appendChild(rich(p));
    c.appendChild(n);
  });
  if(spec.rules){
    spec.rules.forEach(function(r,i){
      var d=el("div","rule");
      d.appendChild(el("div","rn",String(i+1)));
      var t=el("div");
      t.appendChild(el("h4",null,r.h));
      var p=el("p");
      p.appendChild(rich(r.p));
      t.appendChild(p);
      d.appendChild(t);
      c.appendChild(d);
    });
  }
  if(spec.table){
    var tb=el("table","sig");
    var tr=el("tr");
    (spec.table.head||[]).forEach(function(h){tr.appendChild(el("th",null,h));});
    tb.appendChild(tr);
    spec.table.rows.forEach(function(row){
      var r=el("tr");
      row.forEach(function(cell){
        var td=el("td");
        td.appendChild(rich(cell));
        r.appendChild(td);
      });
      tb.appendChild(r);
    });
    c.appendChild(tb);
  }
  if(spec.fams){
    var g=el("div","fam");
    spec.fams.forEach(function(f){
      var d=el("div");
      d.appendChild(el("h4",null,f.h));
      var ul=el("ul");
      f.list.forEach(function(w){ul.appendChild(el("li",null,w));});
      d.appendChild(ul);
      var p=el("p","ru");
      p.style.margin="6px 0 0";
      p.appendChild(rich(f.ru));
      d.appendChild(p);
      g.appendChild(d);
    });
    c.appendChild(g);
  }
  return c;
}

function words(spec){
  var c=el("div","card");
  if(spec.h)c.appendChild(el("h3",null,spec.h));
  var g=el("div","words");
  spec.list.forEach(function(o){
    var d=el("div","word");
    var w=el("div","w");
    w.appendChild(document.createTextNode(o.w));
    w.appendChild(sayBtn(o.w));
    d.appendChild(w);
    var dd=el("div","d");
    dd.appendChild(rich(o.d));
    d.appendChild(dd);
    g.appendChild(d);
  });
  c.appendChild(g);
  return c;
}

function talk(spec){
  var d=el("details","talk");
  d.appendChild(el("summary",null,spec.h||"Talk to your tutor"));
  var box=el("div");
  (spec.body||[]).forEach(function(p){
    var n=el("p");
    n.style.margin="0 0 6px";
    n.appendChild(rich(p));
    box.appendChild(n);
  });
  if(spec.list){
    var ul=el("ul");
    spec.list.forEach(function(t){
      var li=el("li");
      li.appendChild(rich(t));
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  d.appendChild(box);
  return d;
}

function gate(spec){
  var c=el("div","card");
  var g=el("div","gate");
  var lab=el("label");
  lab.appendChild(document.createTextNode("Your name "));
  lab.appendChild(el("span","req","*"));
  g.appendChild(lab);
  var inp=el("input");
  inp.type="text";
  inp.setAttribute("placeholder","Type your name");
  inp.value=S.name||"";
  g.appendChild(inp);
  var hint=el("p","hintline");
  hint.appendChild(rich("{*} = {required field} — обязательное поле. Оставь его пустым, нажми {Submit} и посмотри, что скажет форма. [Так ведут себя все формы со звёздочкой.]"));
  g.appendChild(hint);
  var out=el("div","fb");
  var row=el("div","row");
  var b=el("button","btn","Submit");
  b.type="button";
  b.addEventListener("click",function(){
    var v=inp.value.replace(/^\s+|\s+$/g,"");
    if(!v){showFb(out,"bad","This field is required. — Без имени форма не отправится. Именно так ведут себя все формы с {*}.");return;}
    S.name=v;
    save();
    showFb(out,"ok","Nice to meet you, "+v+". Поехали.");
  });
  row.appendChild(b);
  g.appendChild(row);
  g.appendChild(out);
  c.appendChild(g);
  if(S.name)showFb(out,"ok","Nice to meet you, "+S.name+". Поехали.");
  return c;
}

function rightOf(it){
  var i;
  if(it.t==="mc"){for(i=0;i<it.items.length;i++)if(it.items[i].ok)return{right:it.items[i].t,why:it.items[i].why||""};}
  if(it.t==="gap"){for(i=0;i<it.chips.length;i++)if(it.chips[i].ok)return{right:it.chips[i].t,why:it.chips[i].why||""};}
  if(it.t==="hotspot"){for(i=0;i<it.zones.length;i++)if(it.zones[i].ok)return{right:it.zones[i].z,why:it.zones[i].why||""};}
  if(it.t==="err"){for(i=0;i<it.fixes.length;i++)if(it.fixes[i].ok)return{right:it.fixes[i].t,why:it.fixes[i].why||""};}
  if(it.t==="stack"){
    var a=[];
    it.order.forEach(function(o){a.push(o.t);});
    return{right:a.join(" → "),why:it.done||""};

    }
  }catch(e){}
  renderAll();
  setProgress();
}
reg({n:0,title:"Start",mins:4,
lead:"Interface English is not a language — it is a closed list of about 300 words that repeat everywhere: in a browser, in a game, in a CAD viewer. [Это не язык, это закрытый список слов. Его не учат — его один раз опознают.]",
items:[
  {t:"gate"},

    {h:"Every button is one of four things.",p:"Agree · refuse · postpone · leave. [Согласиться, отказаться, отложить, уйти. Больше вариантов не бывает. Даже если слово незнакомое — оно из одной из этих четырёх семей.]"},

reg({n:1,title:"The Base — ядро кнопок",mins:12,
lead:"Four families. Every button you will ever meet belongs to one of them. [Четыре семьи. Любая кнопка — из одной из них.]",
items:[
  {t:"note",h:"The four families",
   fams:[
    {h:"1 · AGREE — say yes",list:["OK","Accept","Agree","Allow","Confirm","Continue","Submit","Apply","Save","Enable","Turn on"],ru:"[Согласиться. Самая опасная семья: тут ты на что-то соглашаешься.]"},
    {h:"2 · REFUSE — say no",list:["Cancel","Deny","Block","Reject","Decline","Disable","Turn off","Discard","No thanks"],ru:"[Отказаться. Почти всегда безопасно.]"},
    {h:"3 · POSTPONE — later",list:["Skip","Not now","Maybe later","Remind me later","Dismiss","Snooze"],ru:"[Отложить. Окно уйдёт, но вернётся.]"},
    {h:"4 · LEAVE — get out",list:["Close","Exit","Quit","Back","Sign out","Log out","Esc","✕"],ru:"[Уйти. Твой аварийный выход.]"}

  {t:"words",h:"Visibility, steps, help",

  {t:"match",id:"b1q1",

   right:[{k:"1",t:"AGREE — say yes"},{k:"2",t:"REFUSE — say no"},{k:"3",t:"POSTPONE — later"},{k:"4",t:"LEAVE — get out"},{k:"5",t:"REFUSE — and remember it forever"}],
   pairs:{a:"2",b:"3",c:"4",d:"1",e:"5"},

   done:"Все пять на месте. Обрати внимание: ни одно из этих слов не переводится словом «кнопка нажата» — каждое говорит, ЧТО именно случится."},
  {t:"mc",id:"b1q2",

  {t:"err",id:"b1q6",

reg({n:2,title:"Dangerous pairs — опасные пары",mins:12,
lead:"Words that look like synonyms and are not. This is where the real mistakes happen. [Слова, которые кажутся синонимами. Именно здесь и происходят настоящие ошибки.]",
items:[
  {t:"note",h:"Ten pairs — one discriminator each",
   table:{head:["Pair","The difference in one line"],rows:[
    ["{Cancel} · {Close} · {Dismiss}","{Cancel} = не делай то, что я начал. {Close} = убери окно. {Dismiss} = убери сообщение, я его увидел. [В одном окне они не живут вместе — если есть Cancel, то Close там не будет.]"],
    ["{Delete} · {Remove} · {Clear}","{Delete} уничтожает объект. {Remove} вынимает из списка. {Clear} опустошает содержимое, оставляя контейнер. [Remove from cart — товар в магазине остался. Clear history — история пуста, браузер цел.]"],
    ["{Save} · {Apply} · {OK}","{Save} пишет в файл. {Apply} применяет и оставляет окно. {OK} применяет и закрывает. [Хочешь посмотреть и продолжить — Apply.]"],
    ["{Allow} · {Enable}","{Allow} = дать доступ КОМУ-ТО ДРУГОМУ (сайту, программе). {Enable} = включить функцию У СЕБЯ. [Allow the site to use your camera. Enable dark mode. Наоборот не говорят.]"],
    ["{Deny} · {Block} · {Reject} · {Decline}","{Deny} — отказать сейчас. {Block} — отказать навсегда и запомнить. {Reject} — отклонить предложенное. {Decline} — вежливо отказаться. [Deny и Block живут в разрешениях, Reject и Decline — в предложениях и формах.]"],
    ["{Sign in} · {Sign up}","Ключ — предлог. {in} = внутрь, аккаунт уже есть. {up} = создать нового себя, регистрация. [Одна буква меняет всё.]"],
    ["{Undo} · {Reset} · {Restore defaults}","{Undo} — откатить последнее действие. {Reset} — обнулить текущее поле. {Restore defaults} — вернуть заводские настройки всего экрана. [Шаг назад · в ноль · как при покупке.]"],
    ["{Discard} · {Delete}","{Discard} выбрасывает ИЗМЕНЕНИЯ. {Delete} уничтожает ОБЪЕКТ. [Discard changes — документ жив. Delete document — документа нет.]"],
    ["{Hide} · {Close}","{Hide} — объект есть, но не показывается, его можно вернуть. {Close} — окно или файл больше не открыт. [В Creo: Hide деталь — она в дереве модели, просто невидима.]"],
    ["{Export} · {Download}","{Export} пересобирает данные в другой формат. {Download} получает файл по сети. [Часто парой: сначала Export в PDF, потом Download файла.]"]
   ]}},
  {t:"mc",id:"b2q1",
   q:"An online shop: you no longer want an item in your basket. Which button do you look for?",
   sub:"[Не хочешь товар в корзине. Что искать?]",
   items:[
    {t:"{Remove}",ok:1,why:"Верно. {Remove from cart} — товар вынут из ТВОЕГО списка, а в магазине он остался. Магазин не удаляет товар из каталога, когда ты передумал."},
    {t:"{Delete}",near:1,why:"Смысл поймут, но настоящие магазины пишут {Remove}: объект (товар) продолжает существовать, он просто больше не в твоей корзине."},
    {t:"{Clear}",near:1,why:"{Clear} есть рядом — {Clear cart}, «опустошить корзину целиком». Но ты хотел убрать ОДИН товар."},
    {t:"{Discard}",why:"{Discard} про изменения в документе, не про товары."}
   ]},
  {t:"mc",id:"b2q2",
   q:"A browser window says: “meet.example.com wants to use your camera.” You will never want this. Which button?",
   items:[
    {t:"{Block}",ok:1,why:"Да — {Block} значит «нет навсегда, и запомни». Больше этот сайт не спросит."},
    {t:"{Deny}",near:1,why:"Почти. {Deny} — отказ СЕЙЧАС. Сайт спросит снова при следующем визите. Тебе нужен {Block}."},
    {t:"{Decline}",why:"{Decline} — вежливый отказ от приглашения или оплаты, не от доступа к устройству."},
    {t:"{Disable}",why:"{Disable} выключил бы камеру У ТЕБЯ целиком. А ты хотел отказать конкретному сайту."}
   ],
   hint:"Разница между «нет сейчас» и «нет навсегда»."},
  {t:"mc",id:"b2q3",
   q:"{Enable dark mode} or {Allow dark mode} — which one is real English?",

    {t:"{Enable dark mode} — it is my own feature",ok:1,why:"Верно. {Enable} — включить функцию у себя. {Allow} нужен, только когда доступ просит кто-то ДРУГОЙ: сайт, программа, человек."},
    {t:"{Allow dark mode}",why:"Так не говорят. {Allow} требует того, КОМУ разрешают: {Allow this site to…}. Тёмная тема ничего у тебя не просит."},
    {t:"Both are equally correct",why:"Нет, и это надёжное правило: {Allow} — про чужой доступ, {Enable} — про свою функцию."}

  {t:"mc",id:"b2q4",
   q:"In a settings screen you broke everything and want it back the way the maker set it. Which button?",

    {t:"{Restore defaults}",ok:1,why:"Верно. {defaults} — заводские значения. Вернёт ВЕСЬ экран к тому, как было при установке."},
    {t:"{Undo}",why:"{Undo} откатит только ПОСЛЕДНИЙ шаг. Ты сломал пять — придётся жать пять раз, и то если программа помнит."},
    {t:"{Reset}",near:1,why:"Близко, но {Reset} обычно обнуляет одно поле или форму. Заводские настройки — это {Restore defaults}."},
    {t:"{Refresh}",why:"{Refresh} перезапрашивает данные. Настройки не тронет."}

  {t:"match",id:"b2q5",
   q:"Match each button to what survives after you press it.",
   sub:"[Что ОСТАЁТСЯ живым после нажатия? Это самый практичный способ различать эти слова.]",
   left:[{k:"a",t:"Discard changes"},{k:"b",t:"Delete document"},{k:"c",t:"Clear history"},{k:"d",t:"Hide part"},{k:"e",t:"Remove from list"}],
   right:[{k:"1",t:"документ жив, правки выброшены"},{k:"2",t:"ничего не осталось"},{k:"3",t:"браузер цел, список пуст"},{k:"4",t:"деталь в модели, просто не видна"},{k:"5",t:"объект существует, но не в этом списке"}],
   pairs:{a:"1",b:"2",c:"3",d:"4",e:"5"},
   miss:"Спроси себя: что именно исчезло — изменения, объект, содержимое или только видимость?",
   done:"Вот и весь секрет: эти слова различаются не силой, а тем, ЧТО именно исчезает."},
  {t:"match",id:"b2q6",
   q:"Match the pair to its one-line rule.",
   left:[{k:"a",t:"Cancel vs Close"},{k:"b",t:"Sign in vs Sign up"},{k:"c",t:"Apply vs OK"},{k:"d",t:"Export vs Download"}],
   right:[{k:"1",t:"окно остаётся / окно закрывается"},{k:"2",t:"не делай начатое / убери окно"},{k:"3",t:"аккаунт есть / аккаунта нет"},{k:"4",t:"другой формат / передача по сети"}],
   pairs:{a:"2",b:"3",c:"1",d:"4"},
   done:"Четыре правила, каждое в одну строку. Их и надо держать в голове, а не переводы."},
  {t:"gap",id:"b2q7",
   q:"You are in a form with an unfinished text. Complete the warning.",
   before:"If you leave this page, your ",
   after:" will be lost.",
   chips:[
    {t:"changes",ok:1,why:"{Your changes will be lost} — стандартная фраза. Обрати внимание на пассив {will be lost}: не «ты потеряешь», а «будут потеряны». Интерфейс избегает обвинять пользователя."},
    {t:"change",why:"Здесь всегда множественное: {changes}. Устойчивая формула."},
    {t:"file",near:1,why:"Смысл сдвинулся: файл не потеряется, потеряются только несохранённые ПРАВКИ."},
    {t:"data",near:1,why:"Встречается, но каноническая фраза именно {your changes will be lost}."}
   ],
   hint:"То же слово, что в {Discard changes}."},
  {t:"err",id:"b2q8",
   q:"This dialog button is wrong. Find the wrong word, then fix it.",
   sub:"[Окно настроек, и внизу три кнопки. Одно слово выбрано неверно.]",
   tokens:["OK","Apply","Close"],

   found:"Верно. В окне НАСТРОЕК не бывает {Close} рядом с {OK} и {Apply} — там должна стоять кнопка отказа. Какая?",

   fixes:[
    {t:"Cancel",ok:1,why:"Да: канонический набор — {OK} · {Cancel} · {Apply}. {Cancel} значит «не применяй то, что я тут накрутил». {Close} просто убрала бы окно, не сказав, что делать с изменениями."},
    {t:"Dismiss",why:"{Dismiss} живёт на сообщениях и уведомлениях, не в окнах настроек."},
    {t:"Exit",why:"{Exit} закрывает программу целиком."},

     items:[
      {t:"No — {greyed out} means “not available right now”",ok:1,why:"Верно, и это одно из самых полезных знаний за весь урок. Чаще всего надо сначала что-то ВЫДЕЛИТЬ, и кнопка оживёт. В твоём Creo так ведут себя {Hide Selected} и {Isolate}."},
      {t:"Yes, the program has an error",why:"Нет. Серый цвет — это язык интерфейса, а не поломка. Он говорит: «сейчас нельзя, условие не выполнено»."},
      {t:"It means the function is switched off in settings",near:1,why:"Иногда и так, но обычная причина проще: ничего не выбрано."}
     ]},
    {t:"mc",id:"b2x2",extraOnly:1,
     q:"{Log in} or {login} — which one is the noun?",
     items:[
      {t:"{login} — one word is the noun; {log in} — two words is the verb",ok:1,why:"Верно. То же правило работает с {set up}/{setup}, {back up}/{backup}, {sign in}/{sign-in}. Два слова — действие, одно слово — вещь."},
      {t:"{log in} is the noun",why:"Наоборот. Два слова = глагол, действие."},
      {t:"There is no difference",why:"Разница есть, и по ней сразу видно, кнопка это или заголовок."}
     ]},
    {t:"mc",id:"b2x3",extraOnly:1,
     q:"{Update} or {Upgrade} — the program asks for money. Which word was it?",
     items:[
      {t:"{Upgrade}",ok:1,why:"Да. {Upgrade} — переход на более мощную или платную версию. {Update} — просто свежая версия того же самого, обычно бесплатно."},
      {t:"{Update}",why:"{Update} — это та же программа, но новее. Денег за это обычно не просят."}
     ]}
   ]}
]});

reg({n:3,title:"Dialogs — окна, которые требуют решения",mins:12,

    {z:"accept",why:"{Accept all} — «принять все», включая рекламные и аналитические. Именно на эту кнопку рассчитан весь дизайн баннера: она яркая и справа."},
    {z:"manage",near:1,why:"{Manage preferences} тоже приведёт к цели, но откроет ещё один экран с галочками. Дольше. Заметь {…}-логику: эта кнопка не заканчивает разговор, а продолжает его."}

    {z:"cancel",near:1,why:"{Cancel} вернёт тебя в программу, ничего не закрыв. Файл не закрыт, правки не сохранены — задача не выполнена."},
    {z:"x",near:1,why:"{✕} здесь работает как {Cancel}: окно уйдёт, файл останется открытым. Правки по-прежнему не сохранены."}

  {t:"gap",id:"b3q6",

    {t:"—",near:1,why:"Без {to} получается {allow ... use} — так говорят с {let} ({let it use}), но не с {allow}."},
    {t:"that",why:"{allow that} в интерфейсах не встречается."}

   sub:"[Какая строка значит «я сам выберу, что устанавливать»?]",
   items:[
    {t:"{Custom installation}",ok:1,why:"Верно. {Custom} = «по-своему, я решаю сам». Заметь: рядом стоит {Typical installation (recommended)} с точкой в круге — это выбор по умолчанию, и он ОДИН из двух, потому что круг."},
    {t:"{Typical installation (recommended)}",why:"Это противоположное: «как задумал производитель». {recommended} в скобках — подсказка, что тут не надо думать."},

reg({n:4,title:"Your software — лента Creo View Lite",mins:18,
lead:"This is your own screen. Almost every word here also lives in Word, in Photoshop, in a browser. [Это твой экран. Почти каждое слово отсюда встречается и в других программах — поэтому разобрав его, ты разберёшь их все.]",
items:[
  {t:"note",h:"How a ribbon is built — three levels",
   body:[
    "1 · {Tabs} наверху — {File · Home · Markup · Tools · Sectioning · Animation}. Это СУЩЕСТВИТЕЛЬНЫЕ: где я. [Вкладки.]",
    "2 · {Groups} — подписи под рядом кнопок: {Selection · Navigation · Display · Location}. Тоже существительные: о чём этот участок. [Группы.]",

   q:"Look at the {Display} group below: {Hide Selected}, {Show}, {Isolate} and {Thumbnail} are pale grey. Why?",

    {t:"They are broken in the Lite version",near:1,why:"Логичная догадка — {Lite} действительно урезанная версия. Но серый цвет значит другое: условие не выполнено. Здесь — ничего не выделено."},
    {t:"They are switched off in settings",why:"Выключенное в настройках обычно исчезает совсем, а не бледнеет."},
    {t:"I do not have permissions",why:"Про права сказали бы отдельным сообщением: {Access denied} или {insufficient permissions}."}
   ],
   hint:"Прочитай сами надписи. Одно слово в них повторяется и объясняет всё."},
  {t:"hotspot",id:"b4q2",
   q:"Task: earlier you hid several parts. Bring them ALL back on screen.",

   mock:function(){return mockCreo("Home");},

reg({n:6,title:"Furniture words — твоя отрасль",mins:10,

reg({n:7,title:"The game — меню настроек",mins:10,

items:[

  {t:"mc",id:"b7q2",
