<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Банды неправильных глаголов</title>
<style>
:root{
  --night:#1B1233; --panel:#2A1D4D; --panel2:#352561; --edge:#443073;
  --hot:#FF4D9D; --mint:#4BE3C4; --sun:#FFD166; --violet:#B08CFF; --lime:#C6F24E;
  --ink:#F6F0FF; --dim:#A79BC8; --no:#FF7A8A;
  --disp:"Arial Black","Haettenschweiler","Franklin Gothic Heavy",Impact,sans-serif;
  --body:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --mono:"Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  background:var(--night);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%,rgba(255,77,157,.18),transparent 60%),
             radial-gradient(800px 500px at 95% 8%,rgba(75,227,196,.13),transparent 60%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:140}

#hdr{position:relative;flex:0 0 auto;z-index:100;background:rgba(27,18,51,.95);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
#bar{height:6px;background:#241a44}
#bar i{display:block;height:100%;width:0;border-radius:0 6px 6px 0;
  background:linear-gradient(90deg,var(--hot),var(--violet) 50%,var(--mint));transition:width .45s cubic-bezier(.33,1,.68,1)}
.hrow{max-width:640px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:7px}
.brand{font-family:var(--disp);font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-right:auto;line-height:1.1}
.brand i{display:block;font:400 10px/1.3 var(--body);letter-spacing:.14em;color:var(--dim);font-style:normal}
.hbtn{font:inherit;font-size:13px;background:var(--panel);color:var(--dim);border:1px solid var(--edge);
  border-radius:11px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.hbtn:hover{color:var(--ink);border-color:var(--violet)}
.hbtn.on{background:var(--violet);border-color:var(--violet);color:#1B1233;font-weight:bold}
#hdr.bare .hbtn,#hdr.bare .xp{display:none}
.xp{font-family:var(--mono);font-size:12px;color:var(--sun);white-space:nowrap;text-align:right;line-height:1.25}
.xp b{display:block;color:var(--mint);font-weight:normal}

#scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 90px}
h1{font-family:var(--disp);font-size:clamp(28px,8.5vw,44px);line-height:.95;margin:0 0 8px;text-transform:uppercase}
h1 span{color:var(--hot)}
h2{font-family:var(--disp);font-size:clamp(20px,5.8vw,27px);line-height:1.05;margin:0 0 6px;text-transform:uppercase}
h3{font-family:var(--disp);font-size:16px;text-transform:uppercase;margin:22px 0 8px;color:var(--dim)}
p{margin:0 0 12px}
.dim{color:var(--dim)} .small{font-size:14px}

.stamp{display:inline-block;font-family:var(--disp);font-size:19px;padding:6px 13px;border:3px solid currentColor;
  border-radius:12px;transform:rotate(-4deg);text-transform:uppercase;line-height:1}
.c-hot{color:var(--hot)} .c-mint{color:var(--mint)} .c-sun{color:var(--sun)}
.c-violet{color:var(--violet)} .c-lime{color:var(--lime)}
.stamp.thump{animation:thump .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes thump{0%,100%{transform:rotate(-4deg) scale(1)}40%{transform:rotate(-4deg) scale(1.16)}}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:18px;margin:0 0 14px}
.tile{display:flex;gap:13px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--panel);
  border:1px solid var(--edge);border-radius:20px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit;
  transition:transform .12s ease,border-color .12s ease}
.tile:hover{transform:translateY(-2px);border-color:var(--violet)}
.tile .no{font-family:var(--mono);font-size:12px;color:var(--dim)}
.tile b{display:block;font-family:var(--disp);font-size:17px;text-transform:uppercase;line-height:1.15;margin:2px 0}
.tile small{color:var(--dim);font-size:12.5px}
.tile .got{margin-left:auto;text-align:right;font-family:var(--mono);font-size:13px;color:var(--sun);white-space:nowrap}
.tile.next{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,77,157,.18)}
.tile.locked{opacity:.5}
.ico{font-size:26px;width:38px;text-align:center;flex:0 0 38px}

.spec,.line{font-family:var(--mono);letter-spacing:-.02em}
.spec b,.line b{color:var(--mint)}
.line{font-size:16px;line-height:2}
.line .ru{font-family:var(--body);color:var(--sun)}
.big{font-family:var(--mono);font-size:clamp(21px,6.6vw,30px);line-height:1.35;letter-spacing:-.02em;margin:6px 0 2px}
.big b{color:var(--mint)}
.ruBig{font-family:var(--body);font-size:19px;color:var(--sun);margin-bottom:4px}
.hook{font-family:var(--disp);font-size:17px;text-transform:uppercase;color:var(--hot);line-height:1.25;margin-top:14px}

.btn{font:inherit;font-size:16px;font-weight:bold;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;
  background:var(--hot);color:#26102A;transition:transform .1s ease,filter .12s ease}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.wide{display:block;width:100%} .btn.ghost{background:var(--panel);color:var(--dim);border:1px solid var(--edge)}
.btn.mint{background:var(--mint);color:#0C3A33}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.hbtn:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}

.opts{display:grid;gap:10px;margin-top:14px}
.opt{font:inherit;font-size:17px;text-align:left;background:var(--panel2);color:var(--ink);border:2px solid var(--edge);
  border-radius:16px;padding:15px 16px;cursor:pointer;font-family:var(--mono);letter-spacing:-.02em}
.opt.ru{font-family:var(--body);letter-spacing:0}
.opt:hover{border-color:var(--violet)}
.opt.good{background:rgba(75,227,196,.16);border-color:var(--mint);color:var(--mint)}
.opt.bad{background:rgba(255,122,138,.14);border-color:var(--no);color:var(--no)}
.opt.nudge{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,209,102,.22)}
.opt.shown{background:rgba(255,209,102,.14);border-color:var(--sun);color:var(--sun)}
.opt:disabled{cursor:default}
.pass{display:block;width:100%;margin-top:10px;font:inherit;font-size:14px;background:none;border:0;color:var(--dim);
  text-decoration:underline;cursor:pointer;padding:8px}
.pass:hover{color:var(--sun)}
.remind{margin-top:12px;font-size:14px;color:var(--sun);background:rgba(255,209,102,.10);border-radius:12px;
  padding:10px 12px;display:none}
.remind.on{display:block}
.shake{animation:shake .28s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---- drag & drop chant ---- */
.blank{display:inline-block;min-width:104px;padding:3px 6px;border-bottom:3px solid var(--violet);
  color:var(--violet);text-align:center;border-radius:8px 8px 0 0}
.blank.hot{background:rgba(176,140,255,.22);border-color:var(--sun)}
.blank.tip{color:var(--dim)}
.blank.on{color:var(--mint);border-color:var(--mint);background:rgba(75,227,196,.10)}
.blank.miss{background:rgba(255,122,138,.18);border-color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.chip{font:inherit;font-family:var(--mono);font-size:17px;background:var(--panel2);border:2px solid var(--edge);
  color:var(--ink);border-radius:999px;padding:11px 17px;cursor:grab;touch-action:none;user-select:none}
.chip:hover{border-color:var(--violet)}
.chip.held{border-color:var(--sun);background:rgba(255,209,102,.14);color:var(--sun)}
.chip.dragging{opacity:.35}
.chip.used{opacity:.2;cursor:default}
.chip.fly{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);
  box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:grabbing}

/* ---- memory game ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mem{aspect-ratio:1/1.15;border-radius:16px;border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-family:var(--mono);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:6px;text-align:center;line-height:1.2;word-break:break-word}
.mem.back{color:var(--violet);font-family:var(--disp);font-size:22px}
.mem.open{background:rgba(176,140,255,.18);border-color:var(--violet)}
.mem.done{background:rgba(75,227,196,.16);border-color:var(--mint);color:var(--mint);cursor:default}
.mem.wrong{background:rgba(255,122,138,.16);border-color:var(--no)}

.dots{display:flex;gap:6px;margin:0 0 14px}
.dot{height:6px;flex:1;border-radius:99px;background:var(--panel2)}
.dot.on{background:var(--mint)} .dot.now{background:var(--hot)}
.steps{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:6px}

.shelf{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.stk{background:var(--panel2);border:1px solid var(--edge);border-radius:14px;padding:8px 9px;text-align:center;min-width:56px}
.stk .e{font-size:24px;line-height:1.1}
.stk .t{font-size:9.5px;color:var(--dim);line-height:1.2;margin-top:3px}
.stk.locked{opacity:.28}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.vc{background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:8px;font-family:var(--mono);font-size:12.5px}
.vc.got{border-color:var(--mint);color:var(--mint)}
.vc small{display:block;font-family:var(--body);font-size:10.5px;color:var(--dim)}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun))}

input[type=text]{font:inherit;font-size:17px;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--edge);
  background:var(--panel2);color:var(--ink)}
.timer{font-family:var(--disp);font-size:38px;color:var(--sun);line-height:1}
.speak{font:inherit;font-size:15px;background:none;border:1px solid var(--edge);color:var(--dim);border-radius:10px;
  padding:6px 10px;cursor:pointer}
.speak:hover{color:var(--mint);border-color:var(--mint)}
.sent{font-family:var(--mono);font-size:19px;line-height:1.6}
.sent u{color:var(--sun);text-decoration:none;border-bottom:3px solid var(--sun);padding:0 22px}

#dlg{position:fixed;inset:0;z-index:120;background:rgba(12,7,25,.68);display:none;align-items:center;justify-content:center;padding:18px}
#dlg.open{display:flex}
#dlg .sheet{background:var(--panel);border:1px solid var(--edge);border-top:5px solid var(--hot);border-radius:22px;
  padding:22px;max-width:400px;width:100%;animation:pop .26s cubic-bezier(.33,1,.68,1);max-height:88vh;overflow:auto}
#dlg .sheet.t-ok{border-top-color:var(--mint)} #dlg .sheet.t-plain{border-top-color:var(--edge)}
#dlg .sheet.t-gold{border-top-color:var(--sun)}
#dlg h3{font-family:var(--disp);font-size:22px;text-transform:uppercase;margin:0 0 8px;line-height:1.1;color:var(--ink)}
#dlgB{color:var(--dim);font-size:15px} #dlgB b{color:var(--ink)}
#dlgRow{display:flex;gap:10px;margin-top:18px}#dlgRow .btn{flex:1}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}
.slide{animation:slideIn .3s cubic-bezier(.33,1,.68,1)}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header id="hdr" class="bare">
  <div id="bar"><i></i></div>
  <div class="hrow">
    <div class="brand">Банды глаголов<i>irregular verbs</i></div>
    <span class="xp" id="xp"></span>
    <button class="hbtn" id="bColl" type="button">Коллекция</button>
    <button class="hbtn" id="bChant" type="button">Речёвка</button>
    <button class="hbtn on" id="bSound" type="button" title="Звук">♪</button>
    <button class="hbtn" id="bReset" type="button" title="Начать заново">×</button>
  </div>
</header>
<main id="scroll"><div class="wrap" id="app"></div></main>
<div id="dlg"><div class="sheet" id="dlgSheet"><h3 id="dlgT"></h3><div id="dlgB"></div><div id="dlgRow"></div></div></div>

<script>
"use strict";
/* ==================== verb data ==================== */
var GANGS=[
 {n:1,lesson:1,stamp:"-ОТ",cls:"c-hot",name:"Банда «ООООТ»",
  rule:"Все формы кончаются на -ought или -aught. Один хвост на шестерых.",
  hook:["Слышишь общий хвостик «-ОТ»?","Это банда, целый взвод!"],hi:"ought",
  verbs:[{v:"bring",p:"brought",pp:"brought",ru:"приносить"},{v:"buy",p:"bought",pp:"bought",ru:"купить"},
   {v:"teach",p:"taught",pp:"taught",ru:"учить",hi:"aught"},{v:"catch",p:"caught",pp:"caught",ru:"ловить",hi:"aught"},
   {v:"think",p:"thought",pp:"thought",ru:"думать"},{v:"fight",p:"fought",pp:"fought",ru:"сражаться"}]},
 {n:2,lesson:1,stamp:"И-А-У",cls:"c-mint",name:"Банда «И — А — У»",
  rule:"Меняется только гласная в середине: i → a → u. Как гудок паровоза.",
  hook:["И — А — У! И — А — У!","Я гудок себе пою!"],
  verbs:[{v:"begin",p:"began",pp:"begun",ru:"начинать"},{v:"drink",p:"drank",pp:"drunk",ru:"пить"},
   {v:"sing",p:"sang",pp:"sung",ru:"петь"},{v:"swim",p:"swam",pp:"swum",ru:"плыть"},
   {v:"ring",p:"rang",pp:"rung",ru:"звонить"}]},
 {n:3,lesson:1,stamp:"-EN",cls:"c-violet",name:"Банда «фрозен»",
  rule:"Третья форма получает хвостик -en. Как в мультике Frozen: froze + n.",
  hook:["Третья форма — с хвостом -EN,","Как во «Фрозен». Помнишь? Вжух!"],hi:"en",
  verbs:[{v:"break",p:"broke",pp:"broken",ru:"ломать"},{v:"speak",p:"spoke",pp:"spoken",ru:"говорить"},
   {v:"wake",p:"woke",pp:"woken",ru:"будить"},{v:"choose",p:"chose",pp:"chosen",ru:"выбирать"},
   {v:"steal",p:"stole",pp:"stolen",ru:"воровать"},{v:"freeze",p:"froze",pp:"frozen",ru:"замерзать"}]},
 {n:4,lesson:1,stamp:"ОУ-Ю-ОУН",cls:"c-sun",name:"Банда качелей",
  rule:"Качели: ow/y → ew → own/awn. Вверх, вниз и снова вверх.",
  hook:["ОУ — Ю — ОУН, качели вниз,","А потом обратно ввысь!"],hi:"own",
  verbs:[{v:"grow",p:"grew",pp:"grown",ru:"расти"},{v:"know",p:"knew",pp:"known",ru:"знать"},
   {v:"throw",p:"threw",pp:"thrown",ru:"бросать"},{v:"blow",p:"blew",pp:"blown",ru:"дуть"},
   {v:"fly",p:"flew",pp:"flown",ru:"летать"},{v:"draw",p:"drew",pp:"drawn",ru:"рисовать",hi:"awn"}]},

 {n:5,lesson:2,stamp:"-Т",cls:"c-lime",name:"Банда короткого «Т»",
  rule:"Гласная становится короче, и в конце приклеивается -t.",
  hook:["Гласный съёжился — раз, два,","И прилип к нему хвост «Т»!"],hi:"t",
  verbs:[{v:"keep",p:"kept",pp:"kept",ru:"хранить"},{v:"sleep",p:"slept",pp:"slept",ru:"спать"},
   {v:"feel",p:"felt",pp:"felt",ru:"чувствовать"},{v:"leave",p:"left",pp:"left",ru:"уходить"},
   {v:"meet",p:"met",pp:"met",ru:"встречать"},{v:"mean",p:"meant",pp:"meant",ru:"значить"}]},
 {n:6,lesson:2,stamp:"-ОЛД/-ЕНТ",cls:"c-hot",name:"Банда продавцов",
  rule:"Две дружные пары: sell/tell дают -old, send/spend/lend/build дают -t.",
  hook:["Продал, сказал, отправил, сдал —","Хвостик «Д» и хвостик «Т»!"],
  verbs:[{v:"sell",p:"sold",pp:"sold",ru:"продавать",hi:"old"},{v:"tell",p:"told",pp:"told",ru:"рассказать",hi:"old"},
   {v:"send",p:"sent",pp:"sent",ru:"отправлять",hi:"nt"},{v:"spend",p:"spent",pp:"spent",ru:"тратить",hi:"nt"},
   {v:"lend",p:"lent",pp:"lent",ru:"одолжить",hi:"nt"},{v:"build",p:"built",pp:"built",ru:"строить",hi:"lt"}]},
 {n:7,lesson:2,stamp:"= = =",cls:"c-mint",name:"Банда лентяев",
  rule:"Не меняются вообще. Три одинаковые формы — халява.",
  hook:["Три одинаковых подряд —","Самый лучший в мире ряд!"],
  verbs:[{v:"cut",p:"cut",pp:"cut",ru:"резать"},{v:"put",p:"put",pp:"put",ru:"класть"},
   {v:"cost",p:"cost",pp:"cost",ru:"стоить"},{v:"hit",p:"hit",pp:"hit",ru:"ударять"},
   {v:"let",p:"let",pp:"let",ru:"разрешать"},{v:"read",p:"read",pp:"read",ru:"читать («рид — рэд — рэд»)"}]},
 {n:8,lesson:2,stamp:"-ИДН",cls:"c-violet",name:"Банда «-ridden»",
  rule:"Третья форма с хвостом -en, а внутри двойная буква: ridden, written, hidden.",
  hook:["Ride и write, и hide, и drive —","В третьей форме буква -EN!"],hi:"en",
  verbs:[{v:"ride",p:"rode",pp:"ridden",ru:"кататься"},{v:"drive",p:"drove",pp:"driven",ru:"водить"},
   {v:"write",p:"wrote",pp:"written",ru:"писать"},{v:"hide",p:"hid",pp:"hidden",ru:"прятать"},
   {v:"give",p:"gave",pp:"given",ru:"давать"},{v:"eat",p:"ate",pp:"eaten",ru:"есть"}]},

 {n:9,lesson:3,stamp:"TOP-5",cls:"c-sun",name:"Пятёрка-основа",
  rule:"Пять самых частых глаголов языка. Встречаются в любом разговоре.",
  hook:["Be, have, do, и go, и get —","Пять основ, важнее нет!"],
  verbs:[{v:"be",p:"was/were",pp:"been",ru:"быть"},{v:"have",p:"had",pp:"had",ru:"иметь"},
   {v:"do",p:"did",pp:"done",ru:"делать"},{v:"go",p:"went",pp:"gone",ru:"идти"},
   {v:"get",p:"got",pp:"got",ru:"получать"}]},
 {n:10,lesson:3,stamp:"TOP-5+",cls:"c-hot",name:"Вторая пятёрка",
  rule:"Ещё пять глаголов из самой частой десятки.",
  hook:["Make, see, say, и take, и come —","Каждый день их узнаём!"],
  verbs:[{v:"make",p:"made",pp:"made",ru:"создавать"},{v:"see",p:"saw",pp:"seen",ru:"видеть"},
   {v:"say",p:"said",pp:"said",ru:"сказать"},{v:"take",p:"took",pp:"taken",ru:"брать"},
   {v:"come",p:"came",pp:"come",ru:"приходить"}]},
 {n:11,lesson:3,stamp:"WILD",cls:"c-lime",name:"Одиночки",
  rule:"У этих нет общего звука. Зато их всего пять за раз.",
  hook:["Пять упрямых одиночек —","Учим их без проволочек!"],
  verbs:[{v:"find",p:"found",pp:"found",ru:"находить"},{v:"pay",p:"paid",pp:"paid",ru:"платить"},
   {v:"wear",p:"wore",pp:"worn",ru:"носить"},{v:"run",p:"ran",pp:"run",ru:"бегать"},
   {v:"win",p:"won",pp:"won",ru:"побеждать"}]},
 {n:12,lesson:3,stamp:"FINAL",cls:"c-violet",name:"Последняя пятёрка",
  rule:"Финал. После неё закрыт весь список.",
  hook:["Пять последних добежали —","Всю колоду мы собрали!"],

var STORE={
  get:function(k){
    try{
      if(window.storage&&window.storage.get)return window.storage.get(k).then(function(r){return r?r.value:null;},function(){return null;});
      return Promise.resolve(localStorage.getItem(k));
    }catch(e){return Promise.resolve(null);}
  },
  set:function(k,v){
    try{
      if(window.storage&&window.storage.set)return window.storage.set(k,v);
      localStorage.setItem(k,v);
    }catch(e){}
    return Promise.resolve();
  }
};

function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function daysBetween(a,b){
  if(!a)return 99;
  var x=new Date(a.split("-")[0],a.split("-")[1]-1,a.split("-")[2]),
      y=new Date(b.split("-")[0],b.split("-")[1]-1,b.split("-")[2]);
  return Math.round((y-x)/86400000);
}

  var t=today(),d=daysBetween(S.last,t);

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

var AC=null;
function beep(kind){
  if(!S||!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var seq=kind==="ok"?[660,880]:[240,180];
    seq.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=kind==="ok"?"triangle":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+i*.09);
      g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+i*.09+.02);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.09+.16);
      o.connect(g);g.connect(AC.destination);
      o.start(AC.currentTime+i*.09);o.stop(AC.currentTime+i*.09+.18);
    });
  }catch(e){}
}

  if(!S||!S.sound||!("speechSynthesis" in window))return;

/* ==================== confetti ==================== */
var cv=document.getElementById("fx"),ctx=cv.getContext("2d"),parts=[],raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight;}
fit();addEventListener("resize",fit);
function confetti(power){
  if(REDUCED)return;
  var cols=["#FF4D9D","#4BE3C4","#FFD166","#B08CFF","#C6F24E"],
      n=Math.round(50+110*(power==null?1:Math.max(0,Math.min(1,power))));
  for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.7,y:innerHeight*.3+Math.random()*40,
    vx:(Math.random()-.5)*8,vy:Math.random()*-10-3,g:.25+Math.random()*.12,s:5+Math.random()*8,
    r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],life:110+Math.random()*60});
  if(!raf)tick();
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();
    if(p.life<0||p.y>cv.height+40)parts.splice(i,1);
  }
  raf=parts.length?requestAnimationFrame(tick):(ctx.clearRect(0,0,cv.width,cv.height),null);
}

    c.appendChild(line);
  });
  c.appendChild(el("div","hook",esc(g.hook[0])+"<br>"+esc(g.hook[1])));
  app.appendChild(c);

  var chips=el("div","chips"),held=null,misses=0,filled=0;
  function clearHeld(){if(held)held.classList.remove("held");held=null;
    Array.prototype.forEach.call(app.querySelectorAll(".blank"),function(b){b.classList.remove("hot");});}
  function place(chip,slot){
    if(!slot||slot.classList.contains("on"))return;
    if(slot.dataset.want===chip.dataset.w){
      slot.innerHTML=mark(chip.dataset.w,slot.dataset.hi);
      slot.classList.add("on");chip.classList.add("used");
      beep("ok");filled++;clearHeld();
      if(filled===slots.length){
        confetti(.5);say(g.verbs.map(function(v){return v.v+" "+v.p+" "+v.pp;}).join(", "));
        var b=el("button","btn wide mint","Речёвка собрана →");b.type="button";b.onclick=nextStage;
        app.appendChild(b);
      }
    }else{
      misses++;beep("no");
      slot.classList.add("miss");
      setTimeout(function(){slot.classList.remove("miss");},380);
      clearHeld();
      if(misses>=2)showTips();
    }
  }
  function showTips(){
    slots.forEach(function(s){
      if(!s.classList.contains("on")&&s.textContent==="?"){
        s.textContent=s.dataset.want.charAt(0)+"…";s.classList.add("tip");
      }
    });
  }
  function hintFor(chip){
    slots.forEach(function(s){
      if(!s.classList.contains("on")&&s.dataset.want===chip.dataset.w)s.classList.add("hot");
    });
  }
  shuffle(words).forEach(function(w){
    var ch=el("button","chip",esc(w));ch.type="button";ch.dataset.w=w;
    /* tap = select, drag = carry; both end in place() */
    ch.addEventListener("pointerdown",function(e){
      if(ch.classList.contains("used"))return;
      var sx=e.clientX,sy=e.clientY,moving=false,fly=null;
      try{ch.setPointerCapture(e.pointerId);}catch(err){}
      function mv(ev){
        if(!moving&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>10){
          moving=true;
          fly=ch.cloneNode(true);fly.className="chip fly";document.body.appendChild(fly);
          ch.classList.add("dragging");
        }
        if(moving){
          fly.style.left=ev.clientX+"px";fly.style.top=ev.clientY+"px";
          var over=document.elementFromPoint(ev.clientX,ev.clientY);
          Array.prototype.forEach.call(app.querySelectorAll(".blank"),function(b){b.classList.remove("hot");});
          if(over&&over.classList&&over.classList.contains("blank")&&!over.classList.contains("on"))over.classList.add("hot");
        }
      }
      function up(ev){
        ch.removeEventListener("pointermove",mv);ch.removeEventListener("pointerup",up);
        ch.removeEventListener("pointercancel",up);
        ch.classList.remove("dragging");
        if(fly&&fly.parentNode)fly.parentNode.removeChild(fly);
        if(moving){
          var t=document.elementFromPoint(ev.clientX,ev.clientY);
          Array.prototype.forEach.call(app.querySelectorAll(".blank"),function(b){b.classList.remove("hot");});
          if(t&&t.classList&&t.classList.contains("blank"))place(ch,t);
        }else{
          if(held===ch){clearHeld();}
          else{clearHeld();held=ch;ch.classList.add("held");hintFor(ch);}
        }
      }
      ch.addEventListener("pointermove",mv);ch.addEventListener("pointerup",up);
      ch.addEventListener("pointercancel",up);
    });
    /* keyboard / no-pointer fallback */
    ch.addEventListener("click",function(e){
      if(e.detail!==0)return;            /* real taps are handled by pointer events */
      if(held===ch)clearHeld();else{clearHeld();held=ch;ch.classList.add("held");hintFor(ch);}
    });
    chips.appendChild(ch);
  });
  slots.forEach(function(s){
    s.setAttribute("tabindex","0");
    s.addEventListener("click",function(){if(held)place(held,s);});
    s.addEventListener("keydown",function(e){
      if((e.key==="Enter"||e.key===" ")&&held){e.preventDefault();place(held,s);}
    });
  });
  app.appendChild(chips);
  var hint=el("button","pass","показать, куда ставить");hint.type="button";
  hint.onclick=showTips;
  app.appendChild(hint);
}

function regular(v){
  if(/e$/.test(v))return v+"d";
  if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ied";
  return v+"ed";
}

      if(!S.best.boss[cfg.key]||right>S.best.boss[cfg.key]){S.best.boss[cfg.key]=right;save();}
      addXp(20);confetti(right/qs.length);
      dialog("Босс пройден","<div style=\"font-size:30px\">"+"★".repeat(st)+"☆".repeat(3-st)+"</div>"+
        "Верно с первого раза: <b>"+right+" из "+qs.length+"</b>.",
        [{label:"Ещё раз",go:function(){flushThen(function(){gameQuiz(cfg);});}},
         {label:"Назад",go:function(){flushThen(back);},ghost:true}],"ok",function(){flushThen(back);});
      return;
    }
    var v=qs[i],g=gangOfVerb(v),tries=0,c=el("div","card");
    c.appendChild(el("p","dim small","вопрос "+(i+1)+" из "+qs.length+" · верно: "+right));
    c.appendChild(el("div","ruBig",esc(v.ru)));
    c.appendChild(el("div","big",esc(v.v)+" — ? — ?"));
    var others=shuffle(cfg.verbs.filter(function(x){return x.v!==v.v;})).slice(0,optCount(R,i===0)-1);
    var list=shuffle([{t:v.p+" — "+v.pp,ok:true}].concat(others.map(function(o){return{t:o.p+" — "+o.pp,ok:false};})));
    var opts=el("div","opts");
    var rem=el("div","remind",'<span class="stamp '+g.cls+'" style="font-size:12px;padding:3px 8px">'+
      esc(g.stamp)+"</span> "+esc(g.rule));
    list.forEach(function(o){
      var b=el("button","opt"+(o.ok?" correct":""),esc(o.t));b.type="button";
      b.onclick=function(){
        if(b.disabled)return;
        if(o.ok){
          b.className="opt good";beep("ok");say(v.v+", "+v.p+", "+v.pp);
          if(tries===0){right++;markVerb(v,true);}
          noteGood(R);
          Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;});
          i++;setTimeout(ask,650);
        }else{tries++;b.className="opt bad";b.disabled=true;beep("no");noteBad(R);rem.classList.add("on");nudge(opts);}
      };
      opts.appendChild(b);
    });
    c.appendChild(opts);c.appendChild(rem);
    c.appendChild(passBtn(function(){
      var t=opts.querySelector(".opt.correct");if(t)t.className="opt correct shown";
      Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;});
      say(v.v+", "+v.p+", "+v.pp);noteBad(R);rem.classList.add("on");i++;setTimeout(ask,1500);
    }));
    box.appendChild(c);
  }
  ask();slide();toTop();
}

/* ==================== collection & chant ==================== */
function screenColl(){
  app.innerHTML="";paintHeader();
  var back=el("button","hbtn","← назад");back.type="button";back.onclick=screenHome;
  app.appendChild(back);
  app.appendChild(el("h2",null,"Коллекция"));
  var m=mastered(),tot=allVerbs().length;
  var c=el("div","card");
  c.appendChild(el("p","dim small","Карточка открывается, когда ты трижды ответила по этому глаголу верно."));
  c.appendChild(el("p",null,"<b>"+m+"</b> из "+tot));
  var mt=el("div","meter");mt.appendChild(el("i"));mt.firstChild.style.width=(m/tot*100)+"%";
  c.appendChild(mt);
  app.appendChild(c);

  var sc=el("div","card");
  sc.appendChild(el("p","dim small","Наклейки: "+S.stickers.length+" из "+STICKERS.length));
  var shelf=el("div","shelf");
  STICKERS.forEach(function(st){
    var got=S.stickers.indexOf(st.id)>=0;
    shelf.appendChild(el("div","stk"+(got?"":" locked"),
      '<div class="e">'+(got?st.e:"🔒")+'</div><div class="t">'+esc(st.t)+"</div>"));
  });
  sc.appendChild(shelf);app.appendChild(sc);

  LESSONS.forEach(function(L){
    app.appendChild(el("h3",null,L.ico+" "+esc(L.name)));
    var cols=el("div","cols");
    verbsOf(L.n).forEach(function(v){
      var lvl=S.mast[v.v]||0,got=lvl>=3;
      cols.appendChild(el("div","vc"+(got?" got":""),
        (got?esc(v.v)+" — "+esc(v.p)+" — "+esc(v.pp):esc(v.v)+" — ? — ?")+
        "<small>"+(got?esc(v.ru):"ещё "+(3-lvl)+" верных")+"</small>"));
    });
    app.appendChild(cols);
  });
  slide();toTop();
}

function screenChant(){
  app.innerHTML="";paintHeader();
  var back=el("button","hbtn","← назад");back.type="button";back.onclick=screenHome;
  app.appendChild(back);
  app.appendChild(el("h2",null,"Речёвка целиком"));
  app.appendChild(el("p","dim small","Читай вслух с ритмом. Зелёным — общий хвост банды."));
  LESSONS.forEach(function(L){
    app.appendChild(el("h3",null,L.ico+" "+esc(L.name)));
    gangsOf(L.n).forEach(function(g){
      var c=el("div","card");
      c.appendChild(el("p",null,'<span class="stamp '+g.cls+'">'+esc(g.stamp)+"</span>"));
      g.verbs.forEach(function(v){
        var h=tail(g,v);
        c.appendChild(el("div","line",esc(v.v)+" — "+mark(v.p,h)+" — "+mark(v.pp,h)+
          '<span class="ru"> — «'+esc(v.ru)+'»</span>'));
      });
      c.appendChild(el("div","hook",esc(g.hook[0])+"<br>"+esc(g.hook[1])));
      c.appendChild(speakBtn(g.verbs.map(function(v){return v.v+" "+v.p+" "+v.pp;}).join(", ")));
      app.appendChild(c);
    });
  });
  slide();toTop();
}

/* ==================== boot ==================== */
function boot(){
  STORE.get("verbGangs").then(function(raw){
    var loaded=null;
    try{loaded=raw?JSON.parse(raw):null;}catch(e){loaded=null;}
    S=loaded&&typeof loaded==="object"?loaded:blank();
    var d=blank();
    for(var k in d)if(S[k]===undefined)S[k]=d[k];
    if(!S.best)S.best={sprint:0,boss:{}};
    if(!S.best.boss)S.best.boss={};
    document.getElementById("bSound").classList.toggle("on",S.sound);
    document.getElementById("bSound").textContent=S.sound?"♪":"✕♪";
    if(S.name){touchStreak();screenHome();flushThen(null);}else screenStart();
    paintHeader();
  });
}
boot();
</script>
